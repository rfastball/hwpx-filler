name: docs-review-fix
on:
  push:
    branches: [docs/current-state-20260925]
    paths: [.github/workflows/docs-review-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.28'
          enable-cache: false
      - name: Apply and verify the exact comment-only correction
        shell: bash
        run: |
          uv run --no-project --python 3.13 python - <<'PY'
          import base64, bz2, hashlib, os, subprocess, sys
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REF'] == 'refs/heads/docs/current-state-20260925'
          assert git('rev-parse', 'HEAD^') == '69d74459ebb91f9cb2dee69ede6091f95f5850ac'
          payload = ''
          patch = bz2.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4ca03da813c28e8680fa0a1fe537af812dcc72a7ea29b47e91101df45d2d174d'
          target = Path(os.environ['RUNNER_TEMP']) / 'docs-comments.patch'
          target.write_bytes(patch)
          git('apply', '--index', str(target))
          helper = Path('.github/workflows/docs-review-fix.yml')
          saved = helper.read_bytes()
          helper.unlink()
          git('add', '-A')
          subprocess.run([sys.executable, 'scripts/docs_contract.py', '--check'], check=True)
          git('diff', '--cached', '--check')
          tree = git('write-tree')
          assert tree == '1788dbe18aa8646420ec0f3db4302d4415543a8b', tree
          print('Verified exact candidate tree:', tree)
          # Connector removes the temporary workflow; this token changes no workflow.
          helper.write_bytes(saved)
          git('add', str(helper))
          git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'docs: 봉인 자산 주석은 현재 로컬 계약을 참조 (#1009)')
          git('push', 'origin', 'HEAD:refs/heads/docs/current-state-20260925')
          PY
