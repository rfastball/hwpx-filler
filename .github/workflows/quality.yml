name: quality

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact Node and npm
        shell: pwsh
        run: |
          $actualNode = (node.exe --version).Trim()
          $actualNpm = (npm.cmd --version).Trim()
          if ($actualNode -ne 'v24.18.1') { throw "Node version mismatch: $actualNode" }
          if ($actualNpm -ne '11.16.0') { throw "npm version mismatch: $actualNpm" }
      - name: Install locked frontend toolchain
        run: npm.cmd ci
      - name: Build and verify sealed frontend
        run: |
          npm.cmd run build
          npm.cmd run verify:web
      - name: Ruff
        run: uv run --no-sync ruff check src tests scripts
      - name: Pyright
        run: uv run --no-sync pyright

  pytest-package-floor:
    name: pytest + package coverage floor
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact Node and npm
        shell: pwsh
        run: |
          $actualNode = (node.exe --version).Trim()
          $actualNpm = (npm.cmd --version).Trim()
          if ($actualNode -ne 'v24.18.1') { throw "Node version mismatch: $actualNode" }
          if ($actualNpm -ne '11.16.0') { throw "npm version mismatch: $actualNpm" }
      - name: Install locked frontend toolchain
        run: npm.cmd ci
      - name: Build and verify sealed frontend
        run: |
          npm.cmd run build
          npm.cmd run verify:web
      - name: Windows native positive scenarios
        shell: pwsh
        run: |
          Remove-Item Env:HWPX_SKIP_NATIVE_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync pytest -q tests/test_native_positive.py --basetemp="$env:RUNNER_TEMP/native"
      - name: Press-geometry browser precondition
        shell: pwsh
        run: |
          # 눌림 기하 게이트(tests/test_web_press_geometry.py, U2 §2.11)는 **설치 Chrome** 을
          # channel="chrome" 으로 몬다 — 브라우저 다운로드 없음. 런타임 부재를 조용히 스킵하지
          # 않는 규율이라 전제를 여기서 시끄럽게 확인한다. 여기서 죽으면 원인이 한 줄로 보이고,
          # 확인 없이 두면 같은 부재가 테스트 안쪽의 알아보기 힘든 오류로 나온다.
          Remove-Item Env:HWPX_SKIP_MOTION_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(channel='chrome'); print('chrome', b.version); b.close(); p.stop()"
      - name: Quickstart 101 live precondition
        shell: pwsh
        run: |
          # 101 실주행 게이트(tests/test_quickstart_101_live.py, #423)의 전제를 **실행 없이**
          # 확인한다 — Windows 세션·커밋된 101 자산·봉인된 웹 산출물. 완주 자체는 아래 full
          # pytest 안에서 한 번만 돈다(실주행을 두 번 태우지 않는다).
          #
          # 이 단계가 따로 있는 이유는 press-geometry 와 같다: 전제 부재가 테스트 안쪽의
          # 알아보기 힘든 오류로 번역돼 나오면 원인 판독이 늦고, 옵트아웃이 러너에서만 조용히
          # 켜져 있으면 게이트가 통째로 사라진 채 초록이 된다.
          Remove-Item Env:HWPX_SKIP_GUI_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync python scripts/capture_101_screenshots.py check --preflight
      - name: Full pytest with Python coverage
        shell: pwsh
        run: >-
          uv run --no-sync pytest -q
          --junitxml=pytest.xml
          --cov=hwpxcore --cov=hwpxfiller
          --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
          --basetemp="$env:RUNNER_TEMP/pytest"
      - name: Enforce package line and branch floors
        shell: pwsh
        run: |
          uv run --no-sync python scripts/check_package_coverage.py coverage.xml `
            --config docs/package_coverage_floors.toml `
            --markdown-output package-coverage.md
          $gateExit = $LASTEXITCODE
          Get-Content package-coverage.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $gateExit
      - name: Upload pytest and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-package-coverage
          path: |
            pytest.xml
            coverage.xml
            package-coverage.md
          if-no-files-found: warn

  distribution:
    name: distribution (filler + CLI)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked build environment
        run: uv sync --locked --all-extras --group dev --group build
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify exact Node and npm
        shell: pwsh
        run: |
          $actualNode = (node.exe --version).Trim()
          $actualNpm = (npm.cmd --version).Trim()
          if ($actualNode -ne 'v24.18.1') { throw "Node version mismatch: $actualNode" }
          if ($actualNpm -ne '11.16.0') { throw "npm version mismatch: $actualNpm" }
      - name: Install locked frontend toolchain
        run: npm.cmd ci
      - name: Build and verify sealed frontend
        run: |
          npm.cmd run build
          npm.cmd run verify:web
      - name: Build and self-check all portable distributions
        shell: pwsh
        run: .\packaging\build.ps1 -Target all
