name: quality

# 검증 토폴로지는 **생산자 1 + 소비자 N**(N-11B · #424).
#
# 종전에는 세 job 이 각자 프런트를 만들었고 distribution 은 자기 안에서 한 번 더 만들어
# 한 run 에 빌드가 4회였다. 같은 일을 네 번 하는 것도 문제지만 더 나쁜 것은 **네 개의 서로
# 다른 산출물**을 검증하고 있었다는 사실이다 — 어느 job 이 무엇을 봤는지 말할 수 없었다.
#
# 이제 `sealed-web` 하나가 clean checkout 에서 install → build → seal → verify 를 완주하고
# 같은 Node 설치로 프런트 계약을, Rust verifier로 같은 봉인 트리를 검사한다. 산출물과 그
# 정체성(artifact_id·tree_sha256·source commit)을 올리고, 실제 산출물 소비자는 그것을
# 내려받아 `VerifyExisting` 으로 되짚는다. 그 검증은 `setup-node` **앞에** 서서 빌드 도구
# 없이 통과한다 — 순서가 곧 그 주장의 증거다.
#
# 실패 영역도 함께 갈린다. 자원 축이 잡을 나누므로 어느 잡이 빨간지가 곧 무엇이 깨졌는지다:
# 정적 계약 / Rust workspace / Rust 커버리지 하한 / 실 Win32(ignored Rust) / 설치 Chrome 기하
# (Node) / 실 WebView2 / 배포본. 같은 책임은 한 run 에서 정확히 한 번 돈다. 제품도 검증
# 도구도 Rust·Node 로만 돈다.
#
# action 은 전부 **full commit SHA** 로 고정한다. 태그는 움직이는 이름이라 같은 워크플로가
# 어제와 다른 코드를 돌릴 수 있고, 그때 무엇이 바뀌었는지 이 파일은 말해 주지 못한다.

on:
  pull_request:
  merge_group:
  push:
    branches: [master, main]

permissions:
  contents: read

# 같은 PR 의 앞선 run 만 취소한다. `master` push 와 merge queue 는 각자의 이력을 남겨야
# 하므로 취소 대상이 아니다 — 초록이었는지 아무도 모르는 commit 을 만들지 않는다.
#
# 그 약속은 `cancel-in-progress: false` **만으로는 지켜지지 않는다**. 한 그룹에 대기 중인
# run 이 이미 있을 때 새 run 이 들어오면 GitHub 은 취소 설정과 무관하게 **대기 중인 쪽을
# 밀어낸다** — `github.ref` 로 묶으면 master 에 세 번 연속 push 했을 때 가운데 commit 의
# 검증이 완주하지 못한 채 사라진다. 그래서 PR 이 아닌 run 은 commit 마다 자기 그룹을 갖는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sealed-web:
    name: sealed-web (producer)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Prepare pinned Rust web verifier
        run: cargo --version
      - name: Install, build, seal and verify the frontend
        shell: pwsh
        # Node/npm/Vite 핀 확인은 스크립트가 진다 — 워크플로가 같은 수치를 따로 들고 있으면
        # 둘이 어긋나는 날이 온다(단일 출처).
        run: .\build-web.ps1 -Mode Build -IdentityOut web-artifact-identity.json
      - name: Frontend module suite
        run: |
          node scripts/read_toml.mjs --prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test
      - name: Upload the sealed web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-web
          path: |
            build/web
            web-artifact-identity.json
          # sealed 트리에는 `.vite/manifest.json` 이 있다. 이 옵션이 없으면 hidden 으로
          # 걸러져 소비자가 `Vite manifest missing` 으로 죽는다 — 죽는 것 자체는 옳지만
          # 원인이 엉뚱한 자리를 가리킨다.
          include-hidden-files: true
          if-no-files-found: error

  static:
    name: static
    runs-on: windows-latest
    timeout-minutes: 15
    # 산출물을 읽지 않는다 — 정적 검사와 문서·문구·복잡도 계약만 맡는다. 그래서 생산자를
    # 기다리지 않는다. Node/OXC 와 Rust/syn 은 소스 복잡도·TOML 파서로만 들인다. crate 경계
    # (architecture.rs)는 rust-kernel 의 workspace 테스트가 진다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 복잡도 예산의 닫힌 원장은 `origin/master` 와의 merge-base 원장과 견준다. 얕은
          # checkout 에는 그 기준이 없고, 기준 부재는 통과가 아니라 실패다.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the frontend parser toolchain
        run: npm.cmd ci
      - name: Prepare pinned Rust contract parsers
        run: |
          cargo --version
          cargo build --locked -p hwpx-artifact --example read_toml --example complexity_axes
      - name: Documentation contract
        run: |
          node scripts/read_toml.mjs --prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/docs_contract.mjs --check
      - name: Closed JavaScript and Rust complexity budget
        run: node scripts/complexity_budget.mjs --check
      - name: Product copy census
        run: node scripts/ui_copy_census.mjs --check

  rust-coverage:
    name: rust-coverage (package coverage floor)
    runs-on: windows-latest
    timeout-minutes: 45
    # 커버리지와 하한은 이 job 이 **혼자** 소유한다. rust-kernel 은 같은 테스트 집합을 계측 없이
    # 돌려 판정을 내고, 여기서는 계측 빌드(target/coverage)로 패키지별 line·branch 하한만 잰다.
    # llvm-tools 는 rust-toolchain.toml 의 component 로 첫 cargo 호출 때 설치된다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust LLVM coverage floors
        shell: pwsh
        run: |
          .\scripts\rust_coverage.ps1 -MarkdownOutput package-coverage.md
          $gateExit = $LASTEXITCODE
          if (Test-Path package-coverage.md) {
            Get-Content package-coverage.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit $gateExit
      - name: Upload Rust coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-package-coverage
          path: |
            package-coverage.md
            target/coverage/llvm-coverage.json
          if-no-files-found: warn

  windows-native:
    name: windows-native (real Win32)
    runs-on: windows-latest
    timeout-minutes: 20
    # 웹 산출물도 Node 도 쓰지 않는다(실 OLE 아파트·클립보드·최상위 창·자격 증명 저장소).
    # 생산자를 기다리지 않는다. 이름 목록은 test.ps1 과 같고, 소스의 #[ignore] 집합 전체다
    # (tests/js/quality_workflow.test.js 가 대조한다).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Real Win32 dialog, clipboard, focus and credential round trips
        shell: pwsh
        # 이름이 하나라도 어긋나면 libtest 는 0개를 돌리고 성공한다 — 실행 수를 직접 확인한다.
        run: |
          $output = cargo test -p hwpx-desktop --lib --no-default-features --locked -- --ignored --exact `
            dialogs::win::positive_tests::windows_sta_dialog_result_and_pidl_allocator_round_trip `
            single_instance::tests::windows_clipboard_and_visible_focus_round_trip `
            nara_secret_store::tests::windows_credential_store_round_trip
          $code = $LASTEXITCODE
          $output
          if ($code -ne 0) { exit $code }
          if (-not ($output -match '^test result: ok\. 3 passed;')) { throw '실 Win32 ignored 테스트 3개가 모두 실행되지 않았습니다.' }

  browser-render:
    name: browser-render (installed Chrome)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: sealed-web
    # 여기서 나오는 것은 **Chrome 렌더링 증거**다. 실 WebView2 증거가 아니다 — 두 판정을
    # 이름으로도 산출물로도 섞지 않는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the sealed web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-web
          path: .
          digest-mismatch: error
      - name: Prepare pinned Rust web verifier
        run: cargo --version
      - name: Verify the downloaded artifact against this checkout
        shell: pwsh
        run: .\build-web.ps1 -Mode VerifyExisting -ExpectIdentity web-artifact-identity.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked browser driver
        # playwright-core 는 설치 Chrome 을 모는 드라이버일 뿐 브라우저를 내려받지 않는다.
        run: npm.cmd ci --ignore-scripts
      - name: Build the native rhwp roundtrip fixture
        run: cargo build --locked -p hwpx-filler --example browser_fixture
      - name: Press-geometry browser precondition
        shell: pwsh
        run: |
          # 눌림 기하·rhwp 왕복 게이트(tests/browser, U2 §2.11)는 **설치 Chrome** 을
          # channel: 'chrome' 으로 몬다 — 브라우저 다운로드 없음. 런타임 부재를 조용히 스킵하지
          # 않는 규율이라 전제를 여기서 시끄럽게 확인한다. 여기서 죽으면 원인이 한 줄로 보이고,
          # 확인 없이 두면 같은 부재가 테스트 안쪽의 알아보기 힘든 오류로 나온다.
          Remove-Item Env:HWPX_SKIP_MOTION_TESTS -ErrorAction SilentlyContinue
          node --input-type=module -e "import { chromium } from 'playwright-core'; const browser = await chromium.launch({ channel: 'chrome' }); console.log('chrome', browser.version()); await browser.close();"
      - name: Installed Chrome render and rhwp roundtrip suite
        shell: pwsh
        env:
          HWPX_WEB_ARTIFACT_ROOT: build/web
          HWPX_BROWSER_FIXTURE_BIN: target/debug/examples/browser_fixture.exe
        run: node --test --test-concurrency=1 "tests/browser/*.test.js"

  live-webview2:
    name: live-webview2 (native WebView2 Quickstart 101)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: distribution-webview2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-gui
          path: dist/hwpx-filler-web
          digest-mismatch: error
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Native Quickstart 101 journey and restart
        shell: pwsh
        run: |
          .\scripts\run_native_live101.ps1 `
            -Exe dist/hwpx-filler-web/hwpx-filler-web.exe `
            -EvidenceDir live-evidence
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-webview2-evidence
          path: |
            live-evidence/journey/**
            live-evidence/restart/**
            !live-evidence/home/**
          if-no-files-found: warn

  distribution-webview2:
    name: distribution-webview2 (native exe)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: sealed-web
    # 봉인 소비는 Node 설치 전에 실행한다. Node는 고지 생성의 빌드 도구이며
    # 실 WebView2 프로세스는 Node 없는 PATH에서 돌린다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the sealed web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-web
          path: .
          digest-mismatch: error
      - name: Prepare pinned Rust web verifier
        run: cargo --version
      - name: Verify sealed artifact without Node
        shell: pwsh
        run: .\build-web.ps1 -Mode VerifyExisting -ExpectIdentity web-artifact-identity.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked notice inputs
        run: npm ci --ignore-scripts
      - name: Build and self-check all portable distributions
        shell: pwsh
        run: >-
          .\packaging\build_native.ps1 -Target all -SkipCheck
          -WebMode VerifyExisting -ExpectWebIdentity web-artifact-identity.json
          -EvidenceDir build/native-package-evidence-ci
      - name: Verify native restart and display persistence
        shell: pwsh
        run: >-
          .\scripts\verify_native_restart.ps1
          -Exe dist/hwpx-filler-web/hwpx-filler-web.exe
          -EvidenceDir build/native-restart-evidence-ci
      - name: Verify native selftest capability boundary
        shell: pwsh
        run: >-
          .\scripts\verify_native_capability.ps1
          -Exe dist/hwpx-filler-web/hwpx-filler-web.exe
          -EvidenceDir build/native-capability-evidence-ci
      - name: Upload verified native GUI for the live resource owner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-gui
          path: dist/hwpx-filler-web
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-webview2-evidence
          # 봉인 원본/배포본, notice, WebView2 증거를 올리고 격리 홈은 제외한다.
          path: |
            build/native-package-evidence-ci/**
            !build/native-package-evidence-ci/*-home/**
            build/native-restart-evidence-ci/**
            build/native-capability-evidence-ci/**
          if-no-files-found: warn

  rust-kernel:
    name: Rust workspace
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Rust workspace
        shell: pwsh
        run: .\test-rust.ps1

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    # 브랜치 보호가 겨눌 **하나의 이름**. 잡을 늘리거나 이름을 바꿔도 보호 설정을 따라
    # 고치지 않게 여기서 모은다. 대신 열거가 계약이다 — 필수 job 하나가 목록에서 빠지면
    # `tests/js/quality_workflow.test.js` 가 멈춘다.
    if: always()
    needs:
      - sealed-web
      - static
      - rust-coverage
      - windows-native
      - browser-render
      - live-webview2
      - distribution-webview2
      - rust-kernel
    steps:
      - name: Refuse anything that is not a success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        # `success` 만 통과다. 지금 이 워크플로에는 의도된 skip 이 없으므로 `skipped` 도
        # 거절한다 — 조건부 job 을 들이려면 그 의도를 여기 명시로 적어야 한다.
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::필수 job 이 성공하지 않았습니다: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
