name: quality

# 검증 토폴로지는 **생산자 1 + 소비자 N**(N-11B · #424).
#
# 종전에는 세 job 이 각자 프런트를 만들었고 distribution 은 자기 안에서 한 번 더 만들어
# 한 run 에 빌드가 4회였다. 같은 일을 네 번 하는 것도 문제지만 더 나쁜 것은 **네 개의 서로
# 다른 산출물**을 검증하고 있었다는 사실이다 — 어느 job 이 무엇을 봤는지 말할 수 없었다.
#
# 이제 `sealed-web` 하나가 clean checkout 에서 install → build → seal → verify 를 완주하고
# 같은 Node 설치로 JS 단위를, 같은 봉인 트리로 artifact 계약을 검사한다. 산출물과 그
# 정체성(artifact_id·tree_sha256·source commit)을 올리고, 실제 산출물 소비자는 그것을
# 내려받아 `VerifyExisting` 으로 되짚는다. 그 검증은 `setup-node` **앞에** 서서 빌드 도구
# 없이 통과한다 — 순서가 곧 그 주장의 증거다.
#
# 실패 영역도 함께 갈린다. 자원 축(pytest marker)이 잡을 나누므로 어느 잡이 빨간지가 곧
# 무엇이 깨졌는지다: 결정론적 계약 / 실 Win32 / 설치 Chrome 기하 / 실 WebView2 / frozen 배포.
# 같은 책임은 한 run 에서 정확히 한 번 돈다(종전 native 이중 실행은 축 분리로 사라졌다).
#
# action 은 전부 **full commit SHA** 로 고정한다. 태그는 움직이는 이름이라 같은 워크플로가
# 어제와 다른 코드를 돌릴 수 있고, 그때 무엇이 바뀌었는지 이 파일은 말해 주지 못한다.

on:
  pull_request:
  merge_group:
  push:
    branches: [master, main]

permissions:
  contents: read

# 같은 PR 의 앞선 run 만 취소한다. `master` push 와 merge queue 는 각자의 이력을 남겨야
# 하므로 취소 대상이 아니다 — 초록이었는지 아무도 모르는 commit 을 만들지 않는다.
#
# 그 약속은 `cancel-in-progress: false` **만으로는 지켜지지 않는다**. 한 그룹에 대기 중인
# run 이 이미 있을 때 새 run 이 들어오면 GitHub 은 취소 설정과 무관하게 **대기 중인 쪽을
# 밀어낸다** — `github.ref` 로 묶으면 master 에 세 번 연속 push 했을 때 가운데 commit 의
# 검증이 완주하지 못한 채 사라진다. 그래서 PR 이 아닌 run 은 commit 마다 자기 그룹을 갖는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sealed-web:
    name: sealed-web (producer)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install, build, seal and verify the frontend
        shell: pwsh
        # Node/npm/Vite 핀 확인은 스크립트가 진다 — 워크플로가 같은 수치를 따로 들고 있으면
        # 둘이 어긋나는 날이 온다(단일 출처).
        run: .\build-web.ps1 -Mode Build -IdentityOut web-artifact-identity.json
      - name: Frontend module suite
        run: npm.cmd test
      - name: Sealed artifact contract suite
        shell: pwsh
        run: >-
          uv run --no-sync pytest -q tests/artifact_contract
          --basetemp="$env:RUNNER_TEMP/artifact-contract"
      - name: Upload the sealed web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sealed-web
          path: |
            build/web
            web-artifact-identity.json
          # sealed 트리에는 `.vite/manifest.json` 이 있다. 이 옵션이 없으면 hidden 으로
          # 걸러져 소비자가 `Vite manifest missing` 으로 죽는다 — 죽는 것 자체는 옳지만
          # 원인이 엉뚱한 자리를 가리킨다.
          include-hidden-files: true
          if-no-files-found: error

  static:
    name: static
    runs-on: windows-latest
    timeout-minutes: 15
    # 산출물을 읽지 않는다 — 정적 검사와 저장소 형상 계약만 맡는다.
    # 그래서 생산자를 기다리지 않고 Node 도 설치하지 않는다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - name: Ruff
        run: uv run --no-sync ruff check src tests scripts
      - name: Pyright
        run: uv run --no-sync pyright
      - name: Repository contract suite
        shell: pwsh
        run: >-
          uv run --no-sync pytest -q tests/repo_contract
          --basetemp="$env:RUNNER_TEMP/repo-contract"

  pytest-contract:
    name: pytest-contract (package coverage floor)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - name: Contract suite with Python coverage
        shell: pwsh
        # 커버리지와 하한은 이 job 이 **혼자** 소유한다. 저장소 형상과 봉인 산출물 계약은
        # 각각 static·sealed-web 에서 커버리지 없이 돌아 이 분모와 임계 경로를 흐리지 않는다.
        run: >-
          uv run --no-sync pytest -q tests
          --ignore=tests/repo_contract --ignore=tests/artifact_contract
          -m "not native and not browser and not live"
          --junitxml=pytest.xml
          --cov=hwpxcore --cov=hwpxfiller
          --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml
          --basetemp="$env:RUNNER_TEMP/pytest"
      - name: Enforce package line and branch floors
        shell: pwsh
        run: |
          uv run --no-sync python scripts/check_package_coverage.py coverage.xml `
            --config docs/package_coverage_floors.toml `
            --markdown-output package-coverage.md
          $gateExit = $LASTEXITCODE
          Get-Content package-coverage.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $gateExit
      - name: Upload pytest and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-package-coverage
          path: |
            pytest.xml
            coverage.xml
            package-coverage.md
          if-no-files-found: warn

  windows-native:
    name: windows-native (real Win32)
    runs-on: windows-latest
    timeout-minutes: 15
    # 웹 산출물도 Node 도 쓰지 않는다(실 클립보드·실 최상위 창). 생산자를 기다리지 않는다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - name: Windows native positive scenarios
        shell: pwsh
        # 옵트아웃을 **같은 단계에서** 걷는다 — 다른 단계에서 걷으면 그 프로세스에만 적용돼
        # 선언만 남고 결과가 죽는다.
        run: |
          Remove-Item Env:HWPX_SKIP_NATIVE_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync pytest -q -m native --basetemp="$env:RUNNER_TEMP/native"

  browser-render:
    name: browser-render (installed Chrome)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: sealed-web
    # 여기서 나오는 것은 **Chrome 렌더링 증거**다. 실 WebView2 증거가 아니다 — 두 판정을
    # 이름으로도 산출물로도 섞지 않는다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - name: Download the sealed web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-web
          path: .
          digest-mismatch: error
      - name: Verify the downloaded artifact against this checkout
        shell: pwsh
        run: .\build-web.ps1 -Mode VerifyExisting -ExpectIdentity web-artifact-identity.json
      - name: Press-geometry browser precondition
        shell: pwsh
        run: |
          # 눌림 기하 게이트(tests/test_web_press_geometry.py, U2 §2.11)는 **설치 Chrome** 을
          # channel="chrome" 으로 몬다 — 브라우저 다운로드 없음. 런타임 부재를 조용히 스킵하지
          # 않는 규율이라 전제를 여기서 시끄럽게 확인한다. 여기서 죽으면 원인이 한 줄로 보이고,
          # 확인 없이 두면 같은 부재가 테스트 안쪽의 알아보기 힘든 오류로 나온다.
          Remove-Item Env:HWPX_SKIP_MOTION_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(channel='chrome'); print('chrome', b.version); b.close(); p.stop()"
      - name: Press-geometry suite
        shell: pwsh
        run: |
          Remove-Item Env:HWPX_SKIP_MOTION_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync pytest -q -m browser --basetemp="$env:RUNNER_TEMP/browser"

  live-webview2:
    name: live-webview2 (real WebView2 session)
    runs-on: windows-latest
    # 바깥 상한은 안쪽 진단보다 **느슨해야** 한다(N-11A 교훈). 현재 최악 대기는 selftest
    # 합계 1200s + qualified 콜드부팅 실패 75s + 101 바깥 상한 720s = 33.25분이다.
    # 45분이면 테스트별 하드스톱과
    # `if: always()` 증거 회수가 먼저 끝난다. 첫 실패 뒤에는 아래 maxfail 이 형제 부팅을
    # 더 태우지 않는다. 정상 실행은 2~3분이라 평시 비용은 늘지 않는다.
    timeout-minutes: 45
    needs: sealed-web
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # 101 실주행의 보고서·표준출력이 떨어질 자리. 종전에는 pytest 임시 폴더로 가서 잡과
      # 함께 사라졌다 — 실패한 실주행이 무엇을 봤는지 아무것도 남지 않았다.
      HWPX_LIVE_EVIDENCE_DIR: ${{ github.workspace }}/live-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked environment
        run: uv sync --locked --all-extras --group dev
      - name: Download the sealed web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-web
          path: .
          digest-mismatch: error
      - name: Verify the downloaded artifact against this checkout
        shell: pwsh
        run: .\build-web.ps1 -Mode VerifyExisting -ExpectIdentity web-artifact-identity.json
      - name: Quickstart 101 live precondition
        shell: pwsh
        run: |
          # 101 실주행 게이트(tests/test_quickstart_101_live.py, #423)의 전제를 **실행 없이**
          # 확인한다 — Windows 세션·커밋된 101 자산·봉인된 웹 산출물. 완주 자체는 아래 실앱
          # suite 안에서 한 번만 돈다(실주행을 두 번 태우지 않는다).
          #
          # 전제 부재가 테스트 안쪽의 알아보기 힘든 오류로 번역돼 나오면 원인 판독이 늦고,
          # 옵트아웃이 러너에서만 조용히 켜져 있으면 게이트가 통째로 사라진 채 초록이 된다.
          Remove-Item Env:HWPX_SKIP_GUI_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync python scripts/capture_101_screenshots.py check --preflight
      - name: Real app suite and Quickstart 101 check
        shell: pwsh
        # 제품 단언은 **재시도하지 않는다**. 두 번째 시도가 초록이면 첫 번째 빨강이 무슨
        # 뜻이었는지 아무도 묻지 않게 되고, 그 상태의 게이트는 이미 게이트가 아니다.
        run: |
          Remove-Item Env:HWPX_SKIP_GUI_TESTS -ErrorAction SilentlyContinue
          uv run --no-sync pytest -q -m live --maxfail=1 --basetemp="$env:RUNNER_TEMP/live"
      - name: Collect live diagnostics
        if: always()
        shell: pwsh
        # 실패한 실주행은 임시 홈을 **지우지 않고 남긴다**(하니스 계약). 그 잔재의 진단
        # 파일만 골라 회수 자리로 옮긴다 — 홈 전체를 올리면 실 문서까지 따라온다.
        run: |
          $target = "$env:GITHUB_WORKSPACE/live-evidence"
          New-Item -ItemType Directory -Force $target | Out-Null
          Get-ChildItem $env:TEMP -Directory -Filter 'hwpx-101-*' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $leftover = $_
              Get-ChildItem $leftover.FullName -Recurse -File `
                -Include '_live101_hang_stacks.txt', '_live101_result.json' `
                -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Copy-Item $_.FullName (Join-Path $target "$($leftover.Name)-$($_.Name)") -Force
                }
            }
          Get-ChildItem $target -File -ErrorAction SilentlyContinue |
            ForEach-Object { "수집: $($_.Name) ($($_.Length) bytes)" }
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-webview2-evidence
          path: live-evidence
          if-no-files-found: warn

  distribution-webview2:
    name: distribution-webview2 (frozen exe)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: sealed-web
    # frozen 제품·실 WebView2·loopback origin·외부망 격리를 판정한다. Node 를 **설치하지
    # 않는다** — 번들 경계 검사(Node 런타임·frontend source 재유입 금지)가 PATH 에서도
    # 참인 상태로 돈다.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: uv.lock
          # 캐시를 **쓰는** 잡은 전부지만 **저장하는** 잡은 하나다. 일곱이 동시에 같은 키를
          # 예약하려 들면 러너가 「Unable to reserve cache」로 경고하고, 설명 없는 경고는
          # 다음 사람이 워크플로를 읽을 때마다 지나칠 것 하나를 더한다. 저장은 환경이 가장
          # 큰 잡(dev+build)이 진다 — 그 캐시가 나머지의 상위집합이다.
          save-cache: ${{ github.job == 'distribution-webview2' }}
      - name: Install locked build environment
        run: uv sync --locked --all-extras --group dev --group build
      - name: Download the sealed web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sealed-web
          path: .
          digest-mismatch: error
      - name: Build and self-check all portable distributions
        shell: pwsh
        run: >-
          .\packaging\build.ps1 -Target all
          -WebMode VerifyExisting -ExpectWebIdentity web-artifact-identity.json
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-webview2-evidence
          # 패키징이 내는 증거 13파일(산출물 동일성·packaged selftest·외부망 양성/음성 대조·
          # 검증 요약·wheel·두 PYZ archive). 제품 홈 두 개는 뺀다 — 실행 잔재라 증거가 아니다.
          path: |
            build/n03-package-evidence-*/**
            !build/n03-package-evidence-*/home-network-control/**
            !build/n03-package-evidence-*/home-offline/**
          if-no-files-found: warn

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    # 브랜치 보호가 겨눌 **하나의 이름**. 잡을 늘리거나 이름을 바꿔도 보호 설정을 따라
    # 고치지 않게 여기서 모은다. 대신 열거가 계약이다 — 필수 job 하나가 목록에서 빠지면
    # `tests/repo_contract/test_quality_workflow.py` 가 멈춘다.
    if: always()
    needs:
      - sealed-web
      - static
      - pytest-contract
      - windows-native
      - browser-render
      - live-webview2
      - distribution-webview2
    steps:
      - name: Refuse anything that is not a success
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        # `success` 만 통과다. 지금 이 워크플로에는 의도된 skip 이 없으므로 `skipped` 도
        # 거절한다 — 조건부 job 을 들이려면 그 의도를 여기 명시로 적어야 한다.
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
          if [ -n "$failed" ]; then
            echo "::error::필수 job 이 성공하지 않았습니다: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
