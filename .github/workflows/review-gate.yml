name: review-gate

# 리뷰 지적의 **정산 완결성**을 머지 조건으로 세운다(`docs/REVIEW_POLICY.md`).
#
# 이 게이트가 `quality.yml` 이 아니라 별도 파일인 이유는 둘이다. 첫째, 트리거가 다르다 —
# 정산 마커는 코멘트로 오므로 코드 push 가 아닌 이벤트에도 재평가해야 한다. 둘째,
# `tests/test_quality_workflow.py` 가 `quality-gate` 의 job 열거를 계약으로 잠그고 있어
# 거기 job 을 더하면 그 계약이 이 게이트의 사정으로 흔들린다.
#
# 클라이언트 훅이 아니라 여기 서는 이유: Claude Code 훅은 Codex 세션에서 안 뜨고 Codex 쪽
# 설정은 사용자 전역이라 저장소가 소유할 수 없다. **저장소가 소유할 수 없는 규칙은 저장소
# 규율이 아니다.** 두 에이전트가 공통으로 통과하는 지점은 GitHub 뿐이다.

on:
  # `pull_request` 가 아니다. 전자는 **PR 판본**의 워크플로와 스크립트가 돌아 PR 이 자기
  # 게이트를 약화시킬 수 있다. `pull_request_target` 은 base(master) 판본이 돈다. PR head 를
  # 체크아웃하지 않고 `gh api` 만 부르므로 이 트리거의 통상 위험(신뢰 못 할 코드 실행)은
  # 여기 해당하지 않는다.
  pull_request_target:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # job 이름은 `review-gate` 가 **아니다**. 브랜치 보호가 겨누는 이름은 아래 스텝이 PR head
  # SHA 에 직접 게시하는 체크런 쪽이고, 둘이 같은 이름이면 어느 것이 필수인지 흐려진다.
  judge:
    name: judge review settlement
    # 봇이 남긴 PR 아닌 이슈의 코멘트까지 깨우지 않는다.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `pull_request_target` 의 기본 체크아웃은 base ref 다 — 그것이 이 게이트가 원하는
      # 판본이다. ref 를 PR head 로 바꾸지 않는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 판정기는 표준 라이브러리만 쓴다. 여기서 uv 로 프로젝트 환경을 세우면 게이트가 제품
      # 의존성의 건강에 묶인다 — 리뷰 정산을 읽는 데 그럴 이유가 없다.
      - name: Judge and publish the review-gate check run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/review_rounds.py "$PR_NUMBER" --publish-check
