name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      SIGN_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # `test.ps1` 의 복잡도 예산이 `origin/master` merge-base 원장과 견준다 — 얕은
          # checkout 에는 그 기준이 없다.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Prepare pinned Rust web verifier
        run: cargo --version
      - name: Validate release version
        run: node scripts/check_release_version.mjs $env:RELEASE_TAG
      - name: Determine prerelease flag
        shell: pwsh
        run: |
          # 안정판도 성공 종료하고 true/false 를 출력한다. 앞 단계와 같은 태그 검사를 반복해
          # 독립 실행에서도 잘못된 버전이 프리릴리스로 게시되지 않게 한다.
          $flag = node scripts/check_release_version.mjs --prerelease $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'release prerelease classification failed' }
          "IS_PRERELEASE=$flag" | Out-File $env:GITHUB_ENV -Append
      - name: Quality and tests
        shell: pwsh
        # 실창은 아래 Quickstart 101 실주행이 배포본으로 소유한다. 설치 Chrome·실 Win32 검사는 여기서 돈다.
        run: .\test.ps1 -SkipLive
      - name: Build portable applications
        shell: pwsh
        run: |
          .\packaging\build_native.ps1 -Target all -SkipCheck -WebMode VerifyExisting `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP 'release-evidence')
      - name: Native Quickstart 101 journey and restart
        shell: pwsh
        run: |
          .\scripts\run_native_live101.ps1 `
            -Exe dist/hwpx-filler-web/hwpx-filler-web.exe `
            -EvidenceDir live-evidence
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-live-evidence
          path: |
            live-evidence/journey/**
            live-evidence/restart/**
            !live-evidence/home/**
          if-no-files-found: warn
      - name: Validate signing configuration
        shell: pwsh
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:SIGN_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGN_PASSWORD)
          if ($hasCert -xor $hasPassword) { throw 'Both signing secrets must be configured together.' }
          "SIGNED_RELEASE=$($hasCert.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Append
      - name: Sign portable applications
        if: env.SIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          "SIGNTOOL=$($signtool.FullName)" | Out-File $env:GITHUB_ENV -Append
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PASSWORD dist\hwpx-filler-web\hwpx-filler-web.exe
          & $signtool.FullName verify /pa dist\hwpx-filler-web\hwpx-filler-web.exe
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:SIGN_PASSWORD dist\hwpx-cli\hwpx-cli.exe
          & $signtool.FullName verify /pa dist\hwpx-cli\hwpx-cli.exe
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build product installers
        shell: pwsh
        run: .\package-installer.ps1 -App all -SkipExe
      - name: Sign installers
        if: env.SIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          $installers = Get-ChildItem installer-dist\*.exe
          & $env:SIGNTOOL sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:SIGN_PASSWORD $installers.FullName
          & $env:SIGNTOOL verify /pa $installers.FullName
      - name: Smoke test install and uninstall
        shell: pwsh
        run: |
          # 설치 프로그램·onedir 앱 exe 모두 GUI 서브시스템이라 종료코드 포착이 취약하다.
          # Start-Process -Wait -PassThru 로 종료를 확실히 기다리고 .ExitCode 를 읽는다.
          # 설치는 Inno /LOG 를 남겨 실패 시 원인이 CI 로그에 보이게 한다.
          $ErrorActionPreference = 'Stop'
          function Install-Product($setup, $dir, $label) {
            $log = Join-Path $env:RUNNER_TEMP "$label-install.log"
            $p = Start-Process -FilePath $setup.FullName -Wait -PassThru -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log", "/DIR=$dir")
            if ($p.ExitCode -ne 0) {
              Write-Host "--- $label install log (tail) ---"
              if (Test-Path $log) { Get-Content $log -Tail 50 }
              throw "$label install failed (exit $($p.ExitCode))"
            }
          }
          function Invoke-SelfCheck($exe, $checkArgs, $label) {
            $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList $checkArgs
            if ($p.ExitCode -ne 0) { throw "installed $label selfcheck failed (exit $($p.ExitCode))" }
          }
          function Uninstall-Product($dir, $label) {
            $p = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -Wait -PassThru `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            if ($p.ExitCode -ne 0) { throw "$label uninstall failed (exit $($p.ExitCode))" }
          }

          $fillerDir = Join-Path $env:RUNNER_TEMP 'filler-installed'
          $fillerSetup = Get-ChildItem installer-dist\HWPX-Filler-*-Setup.exe | Select-Object -First 1

          Install-Product $fillerSetup $fillerDir 'filler'
          Invoke-SelfCheck (Join-Path $fillerDir 'hwpx-filler-web.exe') @('--selfcheck') 'filler'
          # 설치본이 실제로 무엇을 실었는지는 **제거하기 전에만** 물을 수 있다. 종료코드만
          # 보면 "부팅은 했는데 다른 프런트가 실린" 상태가 초록으로 지나간다(#383).
          # 이 줄이 uninstall 앞에 있는 것이 계약이다.
          & .\scripts\run_web_artifact.ps1 `
            --repo-root . --bundle-root $fillerDir `
            --json-out (Join-Path $env:RUNNER_TEMP 'release-evidence\installed.json')
          if ($LASTEXITCODE -ne 0) { throw 'installed web artifact identity mismatch' }
          Uninstall-Product $fillerDir 'filler'
      - name: Package portable bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $zip = "installer-dist\HWPX-Filler-$version-portable.zip"
          Compress-Archive -Path dist\hwpx-filler-web\* -DestinationPath $zip
          $cliZip = "installer-dist\HWPX-CLI-$version-portable.zip"
          Compress-Archive -Path dist\hwpx-cli\* -DestinationPath $cliZip
          # 사용자가 실제로 여는 것은 dist\ 가 아니라 이 zip 을 푼 결과다. 압축·해제 왕복이
          # 트리를 바꾸지 않았음을 같은 검증기로 되짚는다.
          $expanded = Join-Path $env:RUNNER_TEMP 'portable-expanded'
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          & .\scripts\run_web_artifact.ps1 `
            --repo-root . --bundle-root $expanded `
            --json-out (Join-Path $env:RUNNER_TEMP 'release-evidence\portable.json')
          if ($LASTEXITCODE -ne 0) { throw 'portable web artifact identity mismatch' }
          $cliExpanded = Join-Path $env:RUNNER_TEMP 'cli-portable-expanded'
          Expand-Archive -Path $cliZip -DestinationPath $cliExpanded -Force
          node scripts/verify_cli_bundle.mjs . $cliExpanded
          if ($LASTEXITCODE -ne 0) { throw 'portable CLI notice closure differs' }
          $priorPath = $env:PATH
          $priorHome = $env:HWPXFILLER_HOME
          try {
            $env:PATH = @((Join-Path $env:SystemRoot 'System32'), $env:SystemRoot) -join ';'
            $env:HWPXFILLER_HOME = Join-Path $env:RUNNER_TEMP 'cli-portable-home'
            & (Join-Path $cliExpanded 'hwpx-cli.exe') --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'portable CLI smoke failed' }
          } finally {
            $env:PATH = $priorPath
            $env:HWPXFILLER_HOME = $priorHome
          }
      - name: Reconcile web artifact identity across every shipped copy
        shell: pwsh
        run: |
          # source / native dist / installed / portable — 네 사본이 같은 프런트인가.
          # 각 사본을 따로 통과시키는 것만으로는 부족하다: 넷을 한자리에 놓고 대조해야
          # "어느 한 사본만 다른" 경우가 드러난다(설계 패킷 §5 four artifact IDs).
          #
          # 판정은 Rust hwpx-artifact 하나가 진다(R5-03). 같은 판정이
          # 패키징 게이트에도 필요해졌고, 인라인으로 두면 같은 상태를 두 곳이 판정하게 된다.
          # `--expect` 가 계약이다 — 사본 하나가 조용히 빠진 채 "남은 것끼리 같다"로 초록이
          # 나는 길을 그 선언이 막는다.
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $env:RUNNER_TEMP 'release-evidence'
          & .\scripts\run_web_artifact.ps1 `
            --repo-root . --bundle-root dist\hwpx-filler-web `
            --json-out (Join-Path $evidenceDir 'dist.json')
          if ($LASTEXITCODE -ne 0) { throw 'dist web artifact identity mismatch' }

          & .\scripts\run_web_artifact.ps1 --reconcile `
            --build-metadata build\version\build-metadata.json `
            --copy ('dist=' + (Join-Path $evidenceDir 'dist.json')) `
            --copy ('installed=' + (Join-Path $evidenceDir 'installed.json')) `
            --copy ('portable=' + (Join-Path $evidenceDir 'portable.json')) `
            --expect 'source,dist,installed,portable' `
            --json-out (Join-Path $evidenceDir 'reconciled.json')
          if ($LASTEXITCODE -ne 0) { throw '출하 사본들의 web artifact identity 가 다릅니다.' }

          $metadata = Get-Content build\version\build-metadata.json -Raw -Encoding UTF8 |
            ConvertFrom-Json
          $reconciled = Get-Content (Join-Path $evidenceDir 'reconciled.json') -Raw -Encoding UTF8 |
            ConvertFrom-Json
          [ordered]@{
            version = $metadata.version
            commit = $metadata.commit
            artifact_id = $reconciled.artifact_id
            tree_sha256 = $reconciled.tree_sha256
            toolchain = $metadata.web.toolchain
            runtime_packages = $metadata.web.runtime_packages
            copies = $reconciled.copies
          } | ConvertTo-Json -Depth 5 |
            Set-Content installer-dist\release-evidence.json -Encoding UTF8
      - name: Create checksums and collect metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item build\version\build-metadata.json installer-dist\build-metadata.json
          # 서술 자산(메타데이터·증거)도 해시 대상이다 — 검증 가능한 것만 함께 실어 보낸다.
          $files = @(Get-ChildItem installer-dist\*.exe) +
            @(Get-ChildItem installer-dist\*.zip) +
            @(Get-ChildItem installer-dist\*.json)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content installer-dist\SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body: ${{ env.SIGNED_RELEASE == 'true' && 'Windows artifacts are Authenticode signed.' || 'Unsigned development release; verify SHA256SUMS.txt before use.' }}
          files: |
            installer-dist/*.exe
            installer-dist/*.zip
            installer-dist/SHA256SUMS.txt
            installer-dist/build-metadata.json
            installer-dist/release-evidence.json
