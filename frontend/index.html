<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서나르미</title>
<link rel="icon" type="image/svg+xml" href="img/narmi-mark.svg">
<!-- 테마 영속은 오리진 비의존 Python 설정으로 이관(#74) — 부팅 시 app.py 가 창을 숨긴 채 loaded
     에서 저장 테마를 data-theme 로 주입한 뒤 show 한다(FOUC 은닉). pywebview 엔 첫 페인트 전
     주입 훅이 없어 head 동기 인라인(구 localStorage 판독)은 불가·불필요해 제거했다. -->
<!-- 제품 CSS와 기존 IIFE는 src/main.js의 순서 고정 side-effect import graph가 싣는다. -->
</head>
<body>
<!-- 웹 프론트엔드 셸 — v6 계약의 최상위 구조는 `문서 만들기 | 문서 작업` 2탭이다(§19 서문:
     "새 home 화면은 만들지 않는다"). 상단 토바(64px 구조 치수 · §19.12) + 아래 스테이지이고,
     좌 레일 5화면 라우팅은 재작성 F2 PR-B 에서 사망했다(지도 §10.9 · 대조표 1행).
     과도기 임시 탭 제도는 F8 에 은퇴했다(§10.17.2 판정 E) — 이것이 **최종 형상**이다.
     화면: 문서 만들기(부팅 랜딩 · #90)·문서 작업(전역 라이브러리 · F2 PR-A). home 은
     F2 PR-A, pool 은 F1, 「기안」은 F6 PR-B, scr-tpl 은 F8(승계처 = 편집기 「템플릿」 탭)
     에서 사망, 실행·작업 에디터 별도 화면은 그 이전 슬라이스에서 사망. -->
<div class="app">
  <header class="topbar">
    <!-- #258 제품명 문서나르미 — 세 문서 면이 겹쳐 흐르는 심벌과 텍스트 제품명 락업. 심벌은 장식이라
         aria-hidden(접근 이름은 텍스트 제품명이 담당). 정본=docs/branding/document-narmi-mark-micro.svg.
         레일은 24px 라 **축약형(micro)** 을 싣는다 — 풀 디테일은 이 크기에서 뭉갠다(크기 3단은
         scripts/render_document_narmi_branding.py 의 tier_for 가 단일 출처). path 에 class 를 달지
         않는다 — 제품 고유색은 fill 속성이 지므로 규칙이 한 줄도 없는 class 가 되고(고아 게이트),
         정본 SVG 와 마크업의 path 열이 같아야 드리프트 가드가 한 형태만 본다. -->
    <div class="brand"><span class="brand-lockup"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M3.5 14 L22.5 10.5 L29 16.5 L29.6 22.5 L16 25.5 L17.5 36 L9 40.2 Z" fill="#0E3FAE"/><path d="M20 27.5 L40 23.2 L46.7 29.3 L47.3 34 L29.5 38 L31.8 49.5 L25.5 53.4 Z" fill="#1857D8"/><path d="M34 38.5 L53 34.3 L60 40.5 L61.5 58 L39.5 62 Z" fill="#43C9A8"/><path d="M46 43 H54 V55 H46 Z" fill="#0E3FAE"/></svg><span class="brand-name">문서나르미</span></span></div>

    <!-- 세그먼트 내비 — 계약 2탭 최종 형상(§10.9 판정 B → F8 완성): 과도기 임시 항목·구분선
         제도 자체가 은퇴했다(「기안」 F6 PR-B → 「템플릿 관리」 F8, §10.17.2 판정 E). 활성 =
         은은한 틴트 + 액센트 잉크. `data-scr` 는 **화면 키 그대로**(job·library)이고 개명된
         것은 사용자가 읽는 라벨뿐이다(§10.9 판정 A): job 은 도메인 개체 이름이라 화면 이름이
         바뀌어도 어휘가 갈리지 않는다. 아이콘 표지 .ni 는 레일에서 그대로 승계(#27). -->
    <nav class="nav" aria-label="화면 전환">
      <!-- 「문서 만들기」(구 「작업」 · R-flow #90) — 데이터를 채워 문서를 생성하는 유일 표면.
           R-info 1부 결정 1에 따라 부팅 랜딩이다(#239). -->
      <button class="navbtn" data-scr="job" aria-current="true" aria-label="문서 만들기" title="문서 만들기: 데이터를 고르고 그 데이터로 쓸 문서 작업을 실행">
        <span class="ni"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5v12H4zM11 4h5v7h-5z"/></svg></span><span class="lbl"><span class="n">문서 만들기</span></span></button>
      <!-- 「문서 작업」 전역 라이브러리(§19.6·§19.7, 재작성 F2 PR-A) — 홈 화면의 승계자.
           저장된 작업을 찾는 자리가 여기 하나로 모였다(카드 나열 + group-by 렌즈였던 홈은 사망). -->
      <button class="navbtn" data-scr="library" aria-label="문서 작업" title="문서 작업: 저장된 문서 작업을 찾고 상태를 확인·정리">
        <span class="ni"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v12H4zM10 4h3v12h-3zM15 5l2 11"/></svg></span><span class="lbl"><span class="n">문서 작업</span></span></button>
    </nav>

    <!-- 셸 전역 개인화 — navbtn 이 아니라 라우팅되지 않는다(라우터가 .navbtn 전부에
         go(data-scr) 를 물린다 — 여기 navbtn 이 붙으면 클릭이 화면을 지운다). 레일 하단에서
         토바 우측으로 거처만 옮겼고 라벨 동기 경로(themeLabel·fontScaleLabel)는 그대로다.
         레일 접기(#18/9B2AB35D-A)는 함께 사망 — 토바는 64px 한 줄이라 접을 것이 없다. -->
    <div class="topbar-tools">
      <button class="shell-tool" id="themeToggle" aria-label="테마 전환 (시스템 → 라이트 → 다크)"
              title="테마 전환 (시스템 → 라이트 → 다크)">
        <span class="ti" aria-hidden="true">◐</span><span class="d" id="themeLabel">시스템</span></button>
      <button class="shell-tool" id="fontScaleToggle" aria-label="글자 크기 전환 (기본 → 크게 → 더 크게)"
              title="글자 크기 전환 (기본 → 크게 → 더 크게)">
        <span class="ti" aria-hidden="true">A</span><span class="d" id="fontScaleLabel">기본</span></button>
    </div>
  </header>

  <main class="stage">
    <!-- ============ 「문서 작업」 전역 라이브러리 (§19.6·§19.7 · 재작성 F2 PR-A) ============ -->
    <!-- 홈(카드 나열 + group-by 렌즈)의 승계자. 안정 DOM(id) + library.js 가
         푸시('library', snapshot) 로 값만 채운다. 링1 HomeViewModel 의 보기 4종·작업
         방식 필터·검색·태그 facet·건강 번역을 그대로 소비 — VM 로직 재구현 없음.
         browser(좌) + detail(우) 2-pane 이고 공간 배분은 목록 길이에 끌려다니지 않는다:
         넓고(≥921px) 높은(≥760px) 창에서 두 pane 이 뷰포트를 나눠 각자 스크롤하고 페이지는
         스크롤하지 않는다(library.css .library-browser). 이동은 주입된 Nav 로만 — 이 화면은 다른
         화면 컨트롤러를 모른다. 스코프 경계는 screen_library.py docstring. -->
    <section class="scr" id="scr-library"></section>

    <!-- ============ 「문서 만들기」 화면 (구 「작업」 · R-flow #90 · 재작성 R1 2열) ============ -->
    <!-- 안정 DOM(id) + job.js 가 푸시('job', snapshot) 로 값만 채운다(run/txt 패턴). 링1
         RunViewModel·SelectionModel 에 브리지로 배선 — VM 로직 재구현 없음(#87 가드). 좌 master
         목록 클릭 = 우 패널 in-pane 세션(화면 전환 0). 4존 = 헤더·데이터·본문·완료(블록 1). -->
    <section class="scr on" id="scr-job">
      <header class="scr-head">
        <div>
          <!-- 화면 이름은 계약 어휘(§19 서문 `문서 만들기 | 문서 작업`)로 개명했고 화면 키는
               `job` 그대로다 — Job 은 도메인 개체 이름이라 화면이 개명돼도 어휘가 갈리지
               않는다(지도 §10.9 판정 A). 부제는 데이터-우선 순서를 그대로 말한다. -->
          <h1>문서 만들기</h1>
          <p class="sub">데이터를 고르고, 그 데이터로 쓸 문서 작업을 실행합니다.</p>
        </div>
        <div class="scr-head-actions">
          <!-- 편집 모드의 두 출구(「편집 계속」·「실행으로 돌아가기」)는 편집기가 몰입
               표면이 되며 사망했다(재작성 F7 판정 N): 나가는 경로가 back 하나이고 그때
               patch 처분이 확정되므로 「처분 미확정으로 이탈」 상태 자체가 없다. -->
          <div id="jobStatusHost"></div>
        </div>
      </header>

      <!-- 좌 master 작업 목록은 F2 PR-B 에서 사망(지도 §10.9) — 이 화면은 이제 세션 패널
           하나다. 승계: 작업 선택 = 데이터 준비 뒤 후보 side-card·문서 탐색 면 / 관리 6동사
           (이름 변경·그룹 이동·그룹 이름 변경·해산·접힘·즐겨찾기) = 「문서 작업」 라이브러리의
           행·그룹 헤더·상세 / ＋ 새 작업 = 라이브러리 화면 머리 / 데이터 없는 상태의 작업
           찾기 = 아래 #jobNoDataExit 이 가리키는 라이브러리. -->
      <div class="job-layout">
        <!-- 세션 패널 — v6 `screen-data` 2열(재작성 R1). 좌=현재 데이터(카드·표·거울·결과),
             우=side-card(이 데이터에 사용할 문서·생성 준비 — 구 「선택한 작업」 존은 U2 §4
             판정 A 로 사망, 정체는 활성 카드·액션바 이름이 승계). 구 4존 znum 문법
             (H-03)과 표|거울 duo(#272)는 이 형상으로 대체된다 — 데이터와 문서 선택이 가로로
             마주 보는 것이 v6 의 성격이고, 표↔거울 같은 시야 요구는 세로 인접 + 펼침 면(⤢)이
             승계한다. 정본: docs/archive/DATA_FIRST_INTEGRATION_MAP.md §10.5 R1. -->
        <div class="job-panel" id="jobPanel">
          <!-- 구 미선택 안내 패널은 데이터-우선 전환으로 은퇴 — 세션 표면이 작업 미선택에도
               살아 있고(데이터 존=진입점), 다음 할 일 안내는 게이트 문안(prework_gate)이 승계. -->
          <div class="job-zones" id="jobZones">
            <div class="data-grid" id="jobDataGrid">
            <!-- ── 좌: 현재 데이터 ─────────────────────────────────────────────── -->
            <section class="dg-main">
            <!-- 데이터 존 — 겨눔 + 행 선택 -->
            <div class="zone job-data-zone">
              <div id="jobDataHeaderReactHost"></div>
              <div id="jobPreflight"></div>
              <div id="jobDataBodyReactHost"></div>
            </div>

            <!-- 본문 존 — 표 없는 한 줄(U2 §2.13). 구 거울 테이블·필드축 ack(클릭=확인)는
                 폐기됐다: 값을 말하는 표면은 확인 면(생성 값 미리보기) 하나다. 여기 남는
                 것은 빈 값 표지 + 이름 건수 + 확인 면 출구, 그리고 danger 차단 배너
                 (드리프트·미해소 토큰 — 같은 자리, 같은 형상)뿐이다. -->
            <!-- TXT(검토·복사) 작업에선 이 존 전체가 숨는다: 값 확인은 작업대가 레코드마다
                 눈으로 하는 일이고, 여기 남겨 두면 빈 상태 안내가 행을 다 고른
                 뒤에도 영영 서 있는 이행 불가능한 지시가 된다(F6 PR-A 리뷰 6R). -->
            <div class="zone job-mirror-zone" id="jobMirrorZone"></div>

            <!-- 결과 존 — 세션 스코프(진행·3태 결과·실행 기록). 자리는 v6 상단 result-panel 과
                 달리 좌 본문 하단을 유지한다(지도 §10.10 판정 H — 흐름 순서·스크롤 보존 계약).
                 태는 문안이 아니라 [data-state] 가 소유한다: completed·partiallyCompleted·
                 failed(3태, Python 판정) + running(진행) + rejected(실행 전 거절). -->
            <div class="zone job-result-zone" id="jobResultZone" tabindex="-1"></div>
            </section>

            <!-- ── 우: side-card(이 데이터에 사용할 문서) ──────────────────────── -->
            <aside class="dg-side" id="jobSideCard" aria-label="이 데이터에 사용할 문서">
              <!-- 데이터·작업이 둘 다 없을 때만 서는 출구(지도 §10.9 판정 C) — 데이터 없이
                   작업을 보는 경로는 「문서 작업」이 흡수했고(사용자 확정), 여기서는 그
                   흡수처를 가리키기만 한다. 흡수했다고 적어 놓고 가는 길을 안 보여 주면
                   그게 조용한 소실이다(막다른 화면 금지). -->
              <div class="zone" id="jobNoDataExit"></div>
              <!-- 문서 작업 후보(§18.4·§18.5·§19.3, data-first) — 현재 데이터로 만들 수 있는
                   저장 작업. 판정·순위·추천은 Python(work_candidates) 단일 출처, 여기는 카드
                   렌더만. top=상위 5 순위(별 토글·추천 표지)·more=잘린 수 고지·
                   needs=정직한 비활성(없는 열 병기). -->
              <div class="zone job-cands-row" id="jobCandsRow"></div>

              <!-- 구 「선택한 작업」 존은 사망했다(U2 §4 판정 A, #342) — 실측상 이 존의
                   어포던스는 이관 대상이 아니라 **세 번째 사본**이었다. 승계처: 작업명 =
                   활성 카드 하이라이트 + 액션바 이름(#jobActionName) · 템플릿 파일명 = 활성
                   카드 확장 부제 · 열기/폴더에서 보기 = 활성 카드 ⋮(+라이브러리 상세 신설) ·
                   「템플릿 다시 연결…」 = 경고 카드 기본 클릭 대체 · template_missing 경보 =
                   카드 「연결 상태」 축 · 빈 상태 문안 = 후보 구획 빈 상태가 이미 소유. -->

              <!-- 생성 준비 — 저장 폴더 + 게이트 재진술 블록(상시, 결정 36 D1-B). -->
              <div class="zone">
                <!-- 캡션·저장 폴더 행은 **매체 파생**이다: TXT 는 파일을 만들지 않으므로
                     저장 폴더 축 자체가 없다(§3.2 의 파일 이름 축과 같은 부류). -->
                <div class="zone-cap" id="jobRunCap"></div>
                <div class="run-row" id="jobOutRow"></div>
                <div class="defblk" id="jobRestate"></div>
              </div>
            </aside>
            </div>
          </div>

          <!-- 하단 sticky 액션바(#179 슬라이스 5b) — 생성은 세션의 최종 행동이라 스크롤과 무관하게
               항상 도달 가능해야 한다. 실행 모드(세션 4존)에서만 노출(job.js syncModeDisplay 가
               jobZones 와 함께 토글) — 편집 모드·미선택에선 숨는다. -->
          <div class="session-actionbar" id="jobActionBar"></div>
        </div>
      </div>
    </section>

    <!-- ============ 문서 작업 편집기 (v6 screen-editor · 재작성 F7 PR-A) ============ -->
    <!-- **몰입 표면**: 상단 2탭을 덮고 출구는 back 하나다(지도 §10.13 사용자 확정 2행).
         편집을 「문서 만들기」 안의 한 모드로 두면 상단 탭·화면 내 컨트롤이 전부 처분
         미확정 이탈구가 되고, 가드의 완전성이 표면 수에 비례한다(조용한 누락의 온상).
         출구가 하나면 patch 3택(저장·버리기·머무르기)이 그 한 곳에서 끝난다.
         구 `#jobEditHost`(「작업」 화면 편집 모드, 결정 39)는 여기로 흡수돼 사망 —
         편집 진입은 EditorEntry.land 단일 정의가 이 화면으로 착지시킨다. -->
    <!-- 안쪽 전부가 React 소유다(R4-02 · #415) — 이름 입력·탭 줄·본문·푸터의 id·ARIA·
         「이름은 page-head 인라인」(§10.13.3) 계약은 `src/screens/editor.ts` 가 그대로 진다.
         정적 골격을 여기 남기면 그 자리의 생산자가 둘이 되고 portal 이 mount 전에 거절한다. -->
    <section class="scr" id="scr-editor"></section>


    <!-- ====== TXT 검토·복사 작업대 (v6 S7 · 계약 §11 — 재작성 F6 PR-A) ============ -->
    <!-- 「문서 만들기」에서 TXT 작업을 실행하면 오는 **몰입 화면**(편집기와 같은 부류):
         상단 2탭을 덮고 back 하나로 나간다. 진입 시 고정 사본을 받으므로 데이터 존이 없다.
         안쪽 전부가 React 소유다(R4-02 · #415) — 값은 푸시('workbench', snapshot) 로 온다. -->
    <section class="scr" id="scr-workbench"></section>


    <!-- (「템플릿 관리」(scr-tpl)는 사망 — F8 §10.17: 목록·저작·변환·검토·그룹·삭제는 편집기
         「템플릿」 탭이, 결과 재진술은 그 탭의 결과 줄이 승계. #tplRowMenu·#tplMoveModal·
         #txtEditModal(아래)은 셸 레벨 공용으로 생존하고 소유 JS 만 editor.js 로 옮겼다.) -->

    <!-- ============ 데이터 관리 (등록 데이터 참조 · 수명, #26 #4) ============ -->
    <!-- 안정 DOM(id) + pool.js 가 푸시('pool', snapshot) 로 값만 채운다(tpl 패턴).
         링1 DatasetPoolViewModel(참조 등록·상태 전이·행 성형)에 브리지로 배선 — VM 재구현 없음.
         참조만 저장(행·ServiceKey 없음, ADR J) — 실행 때 원본을 다시 읽는다("싱크").
         나라장터 등록은 동결로 미노출(기존 nara 항목 표시는 유지 — 숨김 금지). -->
    <!-- 「데이터 관리」 화면은 사망(재작성 F1) — 목록·등록·보관·활성화·삭제·다시 연결·손상
         격리는 #dataPickerModal 이 승계했다(지도 §10.7.4). 링1·컨트롤러(PoolController)는
         그대로 살아 그 다이얼로그가 소비한다 — 죽은 것은 표면뿐이다. -->

  </main>
</div>

<!-- H-16: 모달·팝오버의 유일한 포털. 앱 그리드/스크롤 stacking context 밖 body 직속에 둔다. -->
<div id="overlayRoot">

    <!-- (되돌리기 토스트 #undoToast 는 R3-01 에서 React host(#reactOverlayHost)로 이전 —
         id·클래스·ARIA·거동 동등, 정적 골격은 여기 두지 않는다.) -->

    <!-- H-15/H-16 경량층도 같은 body 직속 포털을 쓴다. 좌표는 viewport 기준 Popover.place가 소유. -->
    <div id="libraryGroupMenu" class="ctx-menu" role="menu" style="display:none"></div>
    <div id="tplRowMenu" class="ctx-menu" role="menu" style="display:none"></div>
    <!-- 활성 후보 카드 ⋮(U2 §4 판정 B, #342) — 열기·폴더에서 보기. 내용은 job.js 가 만들고
         위치·표시는 GroupList.createMenu(=Popover.place)가 소유한다(그룹 ⋮ 동형). -->
    <div id="jobCandMenu" class="ctx-menu" role="menu" style="display:none"></div>
    <div class="colpanel" id="jobColPanel" hidden></div>

    <!-- 데이터 고정·등록 모달(#26 #4 → 재작성 F1 승계) — 참조만(경로 포인터). 동명 재등록은
         확인 승격. 데이터 선택 다이얼로그 **위에** 스택으로 뜨며 제목은 진입 사유로 갈린다
         (「이 데이터 고정」·「데이터 등록」·「데이터 다시 연결」 — data_picker.js 소유). -->
    <div id="poolRegModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="poolRegTitle"></div>

    <!-- TXT 템플릿 편집/생성 모달(네이티브 입력 대체 — 인페이지 textarea) -->
    <div id="txtEditModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="txtEditTitle"></div>

    <!-- 시트 선택 모달(#33) — 다중 시트 워크북 확정 게이트. 조용한 첫 시트 로드 금지:
         에디터·작업 두 화면이 공유하며, 취소·Escape 는 로드를 중단한다(첫 시트 강등 없음). -->
    <div id="sheetModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>

    <!-- 「작업」 덮어쓰기 확인은 공용 modal.js Modal.confirm(수치 합성 본문)이 담당한다 —
         전용 모달 DOM 폐기(슬라이스 2, A-2-22: 총량·파괴분·신규분 종류별 재진술). -->

    <!-- 데이터 선택 다이얼로그(재작성 F1, v6 dataPickerDialog) — 「작업」·「기안」 공유.
         현재/고정한/다른 세 구획이 한 면에 있고, 구 `pool` 화면의 목록·등록·보관·활성화·
         삭제·다시 연결·손상 격리를 전부 승계한다(지도 §10.7.4 점검표). 거동은 data_picker.js. -->
    <div id="dataPickerModal" class="modal hidden" role="dialog" aria-modal="true"
         aria-labelledby="dataPickerTitle"></div>

    <!-- 확인 면 = 생성 값 미리보기 **시트**(재작성 F5 드로어의 승격 — U2 §2.13). 레코드별
         실제 주입값·파일 이름·이름 계획 한 줄·명시 승인. 값과 이름은 **실행 입력과 같은
         산출**의 투영이다(지도 §10.12 판정 A): 여기서 따로 계산하면 미리보기가 실행과 다른
         이름을 말한다. 열림·자리·「빈 값 있는 건만 보기」는 Python 소유라 이 DOM 은 뼈대만
         갖고 job.js 가 값을 채운다. 680px 모달에서 시트로 넓힌 이유: 값을 말하는 표면이
         여기 하나뿐이 됐고(§2.13 C3 폐색), 렌더러가 올 자리다. -->
    <div id="previewSheet" class="modal sheet hidden" role="dialog" aria-modal="true"
         aria-labelledby="previewTitle"></div>

    <!-- 그룹 이동 다이얼로그(결정 43) — 기존 그룹 + 새 그룹 입력 동거 + 해제. 소속=생성이라
         빈 그룹은 만들 수 없다(퇴화 불변식). 「문서 만들기」 몫(groupMoveModal)은 좌 목록과
         함께 사망했고(F2 PR-B), 아래 둘이 화면별 wiring 격리로 남는다 — 라이브러리가 작업
         그룹 이동의 승계처다(지도 §10.9 판정 F).
         R4-01 뒤 내용 생산자는 React `screens/library.ts` 의 LibraryMoveDialog portal 이다.
         이 자리는 그 portal 의 **target** 이라 비워 두되 지울 수는 없다. -->
    <div id="libraryMoveModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="libraryMoveTitle"></div>

    <!-- 기안·작업이 한 벌을 쓰는 데이터 펼침 면(#271/#272). 소유 화면의 실 DOM을 이 슬롯으로 이동한다. -->
    <div id="dataSheet" class="modal sheet hidden" role="dialog" aria-modal="true"
         aria-labelledby="dataSheetTitle">
      <div class="modal-card sheet-card">
        <div class="sheet-head">
          <h3 id="dataSheetTitle">데이터 행 고르기</h3>
          <button class="btn" id="dataSheetClose" type="button">닫기</button>
        </div>
        <div class="sheet-body data-sheet-body" id="dataSheetSlot"></div>
      </div>
    </div>

    <!-- 문서 탐색 면(§18.6·§19.5, 데이터-우선 슬라이스 3) — 「문서 만들기」의 **하위 화면**이라
         상단 탭은 계속 「문서 만들기」가 활성이다(별 라우트 아님). 탭·검색·행 판정은 Python(work_candidates)
         소유이고 여기는 받은 구획을 그린다. 사용 가능 행 클릭 = 작업 선택(세션 데이터는 생존). -->
    <div id="jobBrowseSheet" class="modal sheet hidden" role="dialog" aria-modal="true"
         aria-labelledby="jobBrowseTitle"></div>

    <!-- (작업 확인 펼침 면(#272 · 2 pane)은 사망 — U2 §2.13: 두 pane 은 이미 둘 다
         점유돼 있었고(거울 + 파일 이름 계획) 그 내용이 확인 면(#previewSheet) 하나로
         접혔다. 본문 존의 「생성 값 미리보기 ⤢」가 그 면을 연다.) -->

    <!-- 템플릿 그룹 이동 다이얼로그(#108, libraryMoveModal 동형·별도 요소) — 화면별 wiring 격리.
         기존 그룹 + 새 그룹 입력 동거 + 해제. 목록은 editor.js(F8 — tpl 화면 사망의 승계)가
         스냅샷 그룹명으로 채운다. -->
    <div id="tplMoveModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="tplMoveTitle"></div>

    <!-- (promise 다이얼로그 3종 — #confirmModal·#chooseModal·#promptModal — 은 R3-01 에서
         React host(#reactOverlayHost)로 이전. 완전 데이터-구동 표면이라 정적 골격 없이
         host 렌더가 같은 id·클래스·ARIA·초기 문안을 소유한다. 기본 포커스=취소/머무르기·
         Escape=머무르기·danger 재진술 계약(#86·F7·#219)은 파사드 modal.js 가 그대로 진다.
         index.html 재도입은 id 중복(정적 계약 빨강)이다.) -->
</div>

<!-- React 단독 소유 subtree (R2-01 · #405) — legacy 두 트리(div.app·#overlayRoot)와 공동
     변이하지 않는 유일한 React DOM 경계. 비어 보이는 것이 정상이다: 마운트의 실물 증거는
     정적 존재가 아니라 커밋 시 심기는 data-react-mounted 마커가 진다. -->
<div id="reactRoot"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
