# 부분 실창 범위 지도 — **로컬 전용**의 단일 출처(`scripts/live_scope_native.mjs` 가 읽는다).
#
# `test.ps1 -LiveScope <이름[,이름]>|auto|full` 이 이 지도로 native WebView를 고른다.
# CI 환경에서 부분 옵션은 하드 실패하고, 병합 판정은 CI `live-webview2` 전체 실주행이 진다.
# 부분 실행의 초록은 병합 판정이 아니다.
#
# 판정 순서(auto): `shared` 에 걸리면 **전체** → 범위 `paths` 에 걸리면 그 범위들 →
# `no_live` 에 걸리면 실창 불필요 → 어디에도 안 걸리면 **전체**. 애매하면 전체가 기본이다.
# glob 은 저장소 루트 기준 POSIX 경로에 `path.matchesGlob` 으로 맞춘다.
#
# 범위의 `probes` 는 `tests/contracts/selftest-probe-graph.json`(프로브 그래프 스냅숏)의 프로브
# 이름 또는 묶음 id(B·C·D·E·R)다. 한 번의 `--selftest` 부팅이 그 선택과 `after` 닫힘만 돌고,
# 렌더 영수증은 native WebView 자원 게이트가 검사한다.

version = 2

# 하나라도 바뀌면 국소가 아니다 — 앱 셸·브리지·런타임·selftest 엔진·하니스·빌드·잠금 파일.
shared = [
  # 제품 진입·합성 루트·공용 런타임
  "frontend/index.html",
  "frontend/src/main.js",
  "frontend/src/bootstrap.js",
  "frontend/src/product_api.js",
  "frontend/src/push_port.js",
  "frontend/src/shell/**",
  "frontend/src/react/**",
  "frontend/src/runtime/**",
  "frontend/src/state/**",
  "frontend/src/overlay/**",
  "frontend/src/contract/**",
  "frontend/src/ports/**",
  "frontend/src/domain/**",
  "frontend/js/**",
  "frontend/css/tokens.css",
  "frontend/css/base.css",
  "frontend/css/tail.css",
  "frontend/css/overlay.css",
  "frontend/css/forced-colors.css",
  "frontend/fonts/**",
  "frontend/img/**",
  "frontend/vendor/**",
  # selftest 엔진·프로토콜·레지스트리(묶음 파일 자체는 `selftest` 범위)
  "frontend/src/selftest/runner.js",
  "frontend/src/selftest/api.js",
  "frontend/src/selftest/boot.js",
  "frontend/src/selftest/schema.js",
  "frontend/src/selftest/preserve.js",
  "frontend/src/selftest/probes/index.js",
  # 앱 셸·브리지·실창 수명(Rust·Tauri 2)
  "crates/hwpx-desktop/Cargo.toml",
  "crates/hwpx-desktop/build.rs",
  "crates/hwpx-desktop/tauri.conf.json",
  "crates/hwpx-desktop/gen/**",
  "crates/hwpx-desktop/src/bin/documentnarmi.rs",
  "crates/hwpx-desktop/src/lib.rs",
  "crates/hwpx-desktop/src/tauri_host.rs",
  "crates/hwpx-desktop/src/tauri_close_guard.rs",
  "crates/hwpx-desktop/src/boot_budget.rs",
  "crates/hwpx-desktop/src/product_api.rs",
  "crates/hwpx-desktop/src/product_transport.rs",
  "crates/hwpx-desktop/src/native_methods.rs",
  "crates/hwpx-desktop/src/native_authoring_files.rs",
  "crates/hwpx-desktop/src/native_data_sheets.rs",
  "crates/hwpx-desktop/src/native_selftest.rs",
  "crates/hwpx-desktop/src/host_common.rs",
  "crates/hwpx-desktop/src/host_contract.json",
  "crates/hwpx-desktop/src/action_registry.rs",
  "crates/hwpx-desktop/src/action_registry.json",
  "crates/hwpx-desktop/src/web_assets.rs",
  "crates/hwpx-desktop/src/single_instance.rs",
  "crates/hwpx-artifact/Cargo.toml",
  "crates/hwpx-artifact/src/**",
  "crates/hwpx-core/**",
  # 빌드·봉인·패키징·잠금 파일
  "build-web.ps1",
  "build.ps1",
  "test.ps1",
  "run-filler.ps1",
  "package.json",
  "package-lock.json",
  "vite.config.mjs",
  "tsconfig.json",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  ".node-version",
  "packaging/**",
  "vendor/**",
  "scripts/run_web_artifact.ps1",
  "scripts/build_rhwp.ps1",
  "scripts/gen_bridge_contract.mjs",
  "scripts/gen_design_tokens.mjs",
  ".github/**",
  # 실창 범위 지도와 공용 시험 도구
  "tests/contracts/live-scopes.toml",
  "tests/contracts/selftest-probe-graph.json",
  "scripts/live_scope_native.mjs",
  "scripts/run_native_live_scope.ps1",
  "scripts/selftest_probe_graph.mjs",
]

# 실창 결과를 바꿀 수 없는 변경 — 문서·에이전트 설정·live 가 아닌 테스트(위 `shared` 가 먼저다).
no_live = [
  "docs/**",
  "*.md",
  ".claude/**",
  ".codex/**",
  "research/**",
  "tests/**",
  "crates/hwpx-desktop/tests/cli.rs",
  "crates/hwpx-artifact/tests/architecture.rs",
  "crates/hwpx-filler/examples/browser_fixture.rs",
  "scripts/docs_contract*.mjs",
  "scripts/docs_runtime.mjs",
  "scripts/read_toml.mjs",
  "scripts/ui_copy_census.mjs",
  "crates/hwpx-artifact/examples/ui_copy_literals.rs",
  "crates/hwpx-desktop/examples/check_rust_coverage.rs",
  "crates/hwpx-desktop/examples/check_rust_coverage/**",
  "scripts/check_release_version.mjs",
]

# 어느 범위에도 넣지 않는 live 검사 — 전체 실행에서만 돈다. 값은 그 이유다.
[full_only]

[scopes.selftest]
description = "selftest 부팅 한 번(전체 프로브) — 콜드 부팅·101 은 빼고 렌더 계약 전체를 본다"
probes = ["B", "C", "D", "E", "R"]
paths = ["frontend/src/selftest/probes/*.js"]

[scopes.job]
description = "문서 만들기 화면 — 묶음 C(작업 화면)와 데이터 펼침 시트"
probes = ["C", "data_sheet"]
paths = [
  "frontend/src/screens/job_*.ts",
  "frontend/src/screens/data_zone.ts",
  "frontend/css/job.css",
  "frontend/css/jobdata.css",
  "frontend/css/draftcard.css",
  "crates/hwpx-desktop/src/job_*.rs",
  "crates/hwpx-desktop/src/job_registry/**",
  "crates/hwpx-desktop/src/slot_configuration_product.rs",
  "crates/hwpx-desktop/src/slot_configuration_runner.rs",
  # 실제 생성 경로 — 101 실주행도 함께 탄다(`journey101`).
  "crates/hwpx-desktop/src/managed_generation_service.rs",
  "crates/hwpx-desktop/src/artifact_observation.rs",
]

[scopes.data]
description = "데이터 선택·고르기 열 — data_picker 와 그 닫힘(D 묶음 앞단)"
probes = ["data_picker", "range_draft"]
paths = [
  "frontend/src/screens/data_picker.ts",
  "frontend/src/screens/pool_*.ts",
  "frontend/src/screens/sheet_picker.ts",
  "frontend/src/screens/slice_popover.ts",
  "crates/hwpx-desktop/src/pool_controller.rs",
  "crates/hwpx-desktop/src/pool_controller/**",
]

[scopes.authoring]
description = "저작 작업대(TXT·HWPX) — editor_txt_band 와 그 닫힘"
probes = ["editor_txt_band"]
paths = [
  "frontend/src/screens/authoring*.ts",
  "frontend/src/editorview/**",
  "frontend/css/authoring.css",
  "crates/hwpx-desktop/src/authoring_*.rs",
  "tests/corpus/real/bid_notice_limited_under100m.hwpx",
  "tests/corpus/real/filled_notice_marine.hwpx",
]

[scopes.editor]
description = "템플릿 편집기·연결 — editor_* 와 편집 모드 진입"
probes = ["editor_lib", "job_editmode"]
paths = [
  "frontend/src/screens/editor*.ts",
  "frontend/css/editor.css",
  "crates/hwpx-desktop/src/editor_*.rs",
  "crates/hwpx-desktop/src/editor_controller/**",
]

[scopes.workbench]
description = "작업대 화면 — workbench 와 그 닫힘"
probes = ["workbench"]
paths = [
  "frontend/src/screens/workbench*.ts",
  "crates/hwpx-desktop/src/workbench_*.rs",
]

[scopes.library]
description = "템플릿 라이브러리 — 라이브러리 표면·보기 탭·조합 손잡이"
probes = ["library_view_tabs", "tpl_options"]
paths = [
  "frontend/src/screens/library.ts",
  "frontend/css/library.css",
  "crates/hwpx-desktop/src/library_*.rs",
