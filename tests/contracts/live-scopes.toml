# 실창 결과를 바꿀 수 없는 변경 — 문서·에이전트 설정·live 가 아닌 테스트(위 `shared` 가 먼저다).
no_live = [
  "docs/**",
  "*.md",
  ".claude/**",
  ".codex/**",
  "research/**",
  "tests/**",
  "scripts/docs_contract.py",
  "scripts/ui_copy_census.py",
  "scripts/check_package_coverage.py",
  "scripts/check_release_version.py",
]

# 어느 범위에도 넣지 않는 live 테스트 — 전체 실행에서만 돈다. 값은 그 이유다.
[full_only]
"tests/test_web_selftest_gate.py::test_completed_boot_stamps_the_home_and_narrows_the_budget" = "부팅 예산·완주 스탬프는 app.py·boot_budget.py(공유) 소관이다"
"tests/test_web_selftest_gate.py::test_selftest_api_is_absent_without_the_capability_in_real_webview" = "시험 능력 비노출은 selftest 엔진·프로토콜(공유) 소관이다"
"tests/test_web_selftest_gate.py::test_global_allowlist_gate_actually_catches_a_planted_leak" = "전역 allowlist 계측의 양성 대조 — selftest 엔진(공유) 소관이다"
"tests/test_web_selftest_gate.py::test_selftest_run_adds_exactly_one_global_over_a_normal_run" = "전역 델타는 selftest 엔진·프로토콜(공유) 소관이다"

