]

[scopes.settings]
description = "설정·개인화 — 설정 시트 프로브"
probes = ["shell_settings", "personalization_persist"]
paths = [
  "frontend/src/screens/settings_sheet.ts",
  "crates/hwpx-desktop/src/settings_store.rs",
  "crates/hwpx-desktop/src/shell_settings.rs",
]

[scopes.tutorial]
