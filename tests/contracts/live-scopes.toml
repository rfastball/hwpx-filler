# 부분 실창 범위 지도 — **로컬 전용**의 단일 출처(`scripts/live_scope.py` 가 읽는다).
#
# `pytest --live-scope=<이름[,이름]>|auto|full` 이 이 지도로 live 테스트를 고른다. 기본(옵션
# 없음)과 CI 는 언제나 전체다 — CI 환경에서 부분 옵션은 하드 실패하고, 병합 판정은 CI
# `live-webview2` 의 전체 `pytest -m live` 가 진다. 부분 실행의 초록은 병합 판정이 아니다.
#
# 판정 순서(auto): `shared` 에 걸리면 **전체** → 범위 `paths` 에 걸리면 그 범위들 →
# `no_live` 에 걸리면 실창 불필요 → 어디에도 안 걸리면 **전체**. 애매하면 전체가 기본이다.
# glob 은 저장소 루트 기준 POSIX 경로에 `PurePosixPath.full_match` 로 맞춘다(`**` = 0개 이상 폴더).
#
# 범위의 `probes` 는 `tests/contracts/selftest-probe-graph.json`(프로브 그래프 스냅숏)의 프로브
# 이름 또는 묶음 id(B·C·D·E·R)다. 한 번의 `--selftest` 부팅이 그 선택과 `after` 닫힘만 돌고,
# `TestWebSelftestGate` 는 그 닫힘이 내는 키만 읽는 테스트가 남는다(나머지는 deselect).
# `tests` 는 그 밖의 live 테스트(콜드 부팅·101) 노드 id 다 — 파라미터 꼬리 `[...]` 없이 적는다.

version = 1

# 하나라도 바뀌면 국소가 아니다 — 앱 셸·브리지·런타임·selftest 엔진·하니스·빌드·잠금 파일.
