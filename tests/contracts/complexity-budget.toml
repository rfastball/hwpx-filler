# - { value, override = "#이슈", reason }: 분리 중간 단계·측정 보정의 임시 예외.
#   불가피한 상향·신규 항목은 새 이슈를 달아 이 형태로 쓴다(탈출구):
#   function_complexity = { value = 14, override = "#1234", reason = "왜 지금 쪼갤 수 없는가" }
# - { value, reason } (override 없음): 쪼개도 나아지지 않는 구조에 사유를 단 상시 예외.
#   내려가기만 하며 새로 추가할 수 없다 — base에 없는 reason-only 항목은 거부된다.

