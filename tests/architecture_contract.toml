# P3-07 permanent public-surface and vendor-containment contract.
schema = "architecture-contract/v1"

[product_vendor_import]
"hwpxfiller.domain.authoring" = [
  "lxml.etree",
]
"hwpxfiller.domain.fields" = [
  "lxml.etree",
]
"hwpxfiller.domain.schema" = [
  "lxml.etree",
]

[public_surface]
hwpxcore = [
  "Document",
  "extract_document",
]
hwpxfiller = []

# CodeMirror 6 는 **TXT 저작 린트메모장 한 자리**에만 산다(S10-05 #862). 배치 경로가 파일
# 하나인 것이 봉쇄의 얼굴이다 — react 처럼 디렉터리로 넓히면 「편집기가 필요하니 여기도」가
# 파문되고, 그때부터 vendor 타입이 제품 계약에 새기 시작한다. 키맵·언어·자동완성 축은
# 들이지 않았다(패키지 둘이 전부): Escape/Tab 을 CodeMirror 가 먹으면 모달 이탈 가드가
# 조용히 우회된다.
[vendor_integration.codemirror]
packages = [
  "@codemirror/state",
  "@codemirror/view",
]
allowed_source_roots = [
  "frontend/src/editorview/txt_lintpad.ts",
]
mount_owner = "frontend/src/editorview/txt_lintpad.ts|mountLintpad"
update_owner = "frontend/src/editorview/txt_lintpad.ts|updateLintpad"
dispose_owner = "frontend/src/editorview/txt_lintpad.ts|disposeLintpad"

[vendor_integration.react]
packages = [
  "react",
  "react-dom",
]
allowed_source_roots = [
  "frontend/src/overlay/host.ts",
  "frontend/src/react",
  "frontend/src/screens",
  "frontend/src/shell/host.ts",
  # 셸 레벨 튜토리얼 표면(#894) — 화면 stage 밖에 서야 몰입 표면에서도 살아남는다.
  # 파일 하나로 좁힌다(디렉터리로 넓히지 않는다 — codemirror 주석의 그 이유 그대로).
  # #941 에서 진입 표면이 배포본에서 걷히며 이 컴포넌트의 **마운트가 끊겼다**(boundary.ts).
  # 파일과 그 react 의존은 동결로 남으므로 배치 경로도 남는다 — 지우면 여기 사는 react
  # import 가 vendor 봉쇄 위반이 된다. 되살릴 때 마운트만 boundary.ts 에 다시 건다.
  "frontend/src/tutorial/panel.ts",
]
mount_owner = "frontend/src/react/root.ts|boot"
update_owner = "frontend/src/react/boundary.ts|StoreSignal"
dispose_owner = "frontend/src/react/root.ts|unmount"
