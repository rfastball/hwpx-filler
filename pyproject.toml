[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hwpx-filler"
version = "0.5.0"
description = "문서나르미 — 엑셀/CSV 데이터로 HWPX 누름틀 문서를 일괄 생성한다(파서 hwpxcore 위)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lxml>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# 웹 프론트엔드(pywebview) — Qt 이관 완료(#20·#23)로 PySide6 제거.
# pywebview 는 Windows=EdgeChromium(WebView2) 백엔드 핀; 6.x 계열 고정. extra 이름은
# 러너/빌드 관례(--extra gui) 유지 위해 gui 로 둔다(내용은 pywebview 단일).
gui = ["pywebview>=6.2,<7"]
dev = ["pytest>=8.0"]
package = ["pyinstaller>=6.21"]

[dependency-groups]
# 실렌더 증거 도구는 여기 산다 — `src/` 는 안 쓰고(제품 의존이 아니다) 테스트·하니스만 쓴다.
# playwright 는 설치 Chrome 으로 눌림 기하를, pillow 는 실 WebView2 창의 픽셀을 남긴다.
# 선언 없이 `uv run --with` 로 얹으면 잠금 밖 의존이 초록 뱃지를 달고, 그 명령을 아는 사람만
# 재현할 수 있다(#779).
dev = [
    "pillow>=11.0",
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "playwright>=1.49",
    "pyyaml>=6.0",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6.21",
]

[project.scripts]
hwpxfiller = "hwpxfiller.cli:main"

[project.gui-scripts]
# pywebview 웹 진입점만 남는다 — 구 Qt 진입점(hwpx-filler)은 PySide6 제거(#23)로 폐기.
hwpx-filler-web = "hwpxfiller.webapp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hwpxcore", "src/hwpxfiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# marker 는 **자원 경계**다 — 그 테스트가 무엇을 켜야 도는가(N-11B). CI 는 이 세 축으로 잡을
# 갈라 실패 영역을 분리하고, 남는 무표 집합이 결정론적 contract suite 가 된다. 축은 기존
# `skipif` 옵트아웃을 대체하지 않고 그 위에 얹는다 — 게이트를 켜는 줄이 사라지지 않았는지
# 세는 음성 대조(`tests/test_quality_workflow.py`)가 그 줄들을 계속 보아야 하기 때문이다.
#
# 새 marker 는 **여기 먼저** 등록한다. `--strict-markers` 가 미등록 mark 를 수집 단계에서
# 죽인다 — 오타난 mark 가 조용히 아무것도 선택하지 않는 길을 막는 것이 목적이다.
markers = [
  "native: 실 Win32 자원(클립보드·최상위 창)을 쓰는 Windows 네이티브 경계 — 옵트아웃 HWPX_SKIP_NATIVE_TESTS",
  "browser: 설치 Chrome + Playwright 로 재는 실렌더 기하·모션 경계 — 옵트아웃 HWPX_SKIP_MOTION_TESTS",
  "live: 실 WebView2 창을 띄우는 실앱 경계(selftest·101 실주행) — 옵트아웃 HWPX_SKIP_GUI_TESTS",
]
addopts = ["--strict-markers"]

[tool.coverage.run]
branch = true
source = ["hwpxcore", "hwpxfiller"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["build", "dist"]
reportArgumentType = "none"
reportAssignmentType = "none"
reportAttributeAccessIssue = "none"
reportCallIssue = "none"
reportOptionalMemberAccess = "none"
