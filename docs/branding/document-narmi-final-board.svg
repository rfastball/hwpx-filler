  <text x="96" y="142" fill="#667085" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="17">세 겹의 문서가 한 단계씩 나아가며 전달 동작으로 완성됩니다.</text>

