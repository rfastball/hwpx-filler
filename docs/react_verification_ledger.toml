# ---------------------------------------------------------------------------
# 사슬 밖 루트 파일 — 루트는 폐포로 답한다
#
# 루트 추적 파일은 전부 검증 트리·분모 밖 축·이 목록 중 정확히 한 곳에 있어야 하고,
# 게이트가 그 폐포를 재실측한다. 그래서 새 루트 파일은 축이든 여기든 **분류를 요구받는다**
# — 조용한 편입도(계산 종류가 추측으로 삼키는 것), 조용한 탈락도(열거에서 빠지는 것) 없다.
# R1-99 감사(F2)가 잡은 「형제 누락」이 이 폐포가 태어난 이유다: 축을 손으로 열거하는 한
# 빠뜨림은 기억의 문제로 남고, 이 저장소는 그 결함류를 한 라운드에 네 번 밟았다.
#
# 이 목록의 뜻은 「게이트가 데이터로 읽지 않고 판정 바이트에도 닿지 않는다」다.
# 반대 증거가 생기면 옮기는 방향(사슬 밖 → 축)은 언제나 자유다.
# ---------------------------------------------------------------------------

