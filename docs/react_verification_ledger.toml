# React 전환 old→new 검증 책임 원장 (R1-03 · #403)
#
# 설계 정본: #403 의 `R-DESIGN-PACKET:v1` rev3.
# 상위 결정: #394 (R-D03 의미 불변 · R-D11 단계별 재설계 · L17 실행되지 않는 텍스트는 계약이 아니다).
#
# ## 이 원장이 하는 일 — 딱 하나
#
# R2~R4 가 검증 자산을 교체할 때 **비교 대상이 되는 「before」 열을 고정**한다.
# R1 은 어떤 자산도 옮기지 않는다. 그래서 오늘 모든 행의 `successor` 는 `keep` 이고,
# 그것이 기본값이라 적히지 않는다. `successor` 가 적히는 순간이 실제 교체가 일어나는
# 순간이고, 그때 그 PR 이 후계를 대고 게이트가 실재를 확인한다.
#
# ## 이 원장이 **들지 않는** 것
#
# 개수를 들지 않는다. 센서스도, 집합 크기도, 테스트 수도.
#
# 2차 폐기(#469)의 진단이 그것이었다 — 게이트의 테스트 개수가 이 원장의 값이라,
# 음성 대조를 하나 더할 때마다 원장을 손으로 고쳐야 했고 여덟 번 반복했다. 지금은
# `tests/test_react_verification_ledger.py` 도 그냥 자산 행 하나이고 개수가 없다.
# 게이트를 키워도 이 파일은 안 변한다. **치닫는 회로가 존재하지 않는다.**
#
# 테스트 센서스의 소유는 #455 다. 이 원장은 그 자리를 비워 두고 가리키기만 한다.
#
# ## 두 필드의 계약
#
# `responsibility` 는 **산문**이다. 게이트가 읽지 않고(L17 ⑴), 검증자의 위임 범위
# 밖이다(L17 ⑵). 늙어도 초록이며, 그 조건에서만 이 필드를 둔다. 실제 판별은 R2~R4 가
# 자산을 교체할 때 그 PR 이 진다.
#
# `owner_stage` 는 **인계선**이다. 이 자산을 어느 단계가 만질지 미리 지목한다.
# 어휘는 게이트 리터럴이 든다 — 여기서 유도하면 오타가 새 단계를 발명한다.
#
# ## 분모를 줄이는 길이 막혀 있다
#
# 검증 트리의 정의(어떤 경로가 이 원장의 대상인가)와 웹 표면 술어는 **게이트에만** 산다.
# 이 파일에 사본이 없는 이유는 사본이 늙기 때문이다 — rev3 집필 중에 실제로 같은 술어를
# 두 벌 쓰다가 값이 갈렸다(`selftest` 한 조각 누락).
#
# `out_of_scope` 로 파일을 옮겨 자산을 줄이는 것은 게이트가 막는다: 제외 목록의 어떤
# 파일도 웹 표면에 닿으면 안 된다. 넓히는 방향(제외 → 자산)은 언제나 자유다.
#
# 그 술어는 **헬퍼 경유 소비까지** 본다(`_web_source`·`_press_probe`·`_web_artifact_contract`).
# 이게 없으면 술어가 규약을 지킬수록 눈이 먼다 — `tests/test_web_source_role.py` 가 정적
# 테스트에게 물리 source 경로 재조립을 금지하므로, 모범적인 웹 테스트일수록 `frontend/` 를
# 직접 안 쓴다. 좁은 판에서는 그런 파일 열이 제외에 영영 앉아 있을 수 있었고, 그중에는
# 실렌더 눌림 기하(`tests/test_web_press_geometry.py`)도 있었다.
#
# **봉인된 산출물을 다루는 것까지도 본다**(R1-99 감사가 넓혔다). 헬퍼 *이름*은 들었는데 그것이
# 가리키는 도메인 어휘를 안 들어, Vite 산출물의 정체성을 대조하는 파일 둘이 제외에 앉아 있었다.
# 프런트가 무엇으로 빌드되든 그 산출물을 재는 자리는 R2 가 빌드를 갈아 끼우면 함께 움직인다.
#
# 술어의 실물과 갈래는 여전히 게이트에만 있다. 이 문단은 **왜 그 갈래인가**만 적는다.

schema = "react-verification-ledger/v1"
