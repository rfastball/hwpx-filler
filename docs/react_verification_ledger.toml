# old→new 검증 책임 원장 — R1-03 (#403)
#
# 이 파일은 **기계 판독 원장**이다. 산문 설계는 `docs/REACT_MIGRATION_DECISIONS.md`(#401)가
# 지고, DOM·상태·구독·수명주기의 소유권은 `docs/react_ownership_inventory.toml`(#402)이
# 진다. 셋은 같은 문장을 두 번 들지 않는다.
#
# 게이트: `tests/test_react_verification_ledger.py`. 그 게이트는 **이 파일의 선언을 믿지
# 않는다** — 축마다 술어를 저장소에 다시 돌리고, 원장이 안 든 파일이 있으면 거절한다.
#
# 손으로 고칠 때의 규칙 넷:
#   1. 파일 참조는 `path` · `path::test_함수명` · `path#부분문자열[@N]` 셋 중 하나다.
#      **생 `file:line` 은 원장 값으로 금지**한다 — 앞줄이 하나 늘면 그날로 거짓이 된다.
#      `#` 앵커는 그 파일에서 **유일**해야 하고, 유일하지 않으면 `@N`(N≥1)으로 수를 적는다.
#      `@0` 은 앵커가 아니다 — 없는 것을 가리키면 아무 문자열이나 증거가 된다.
#   2. 값을 든 항목은 `predicate`·`scope`·`unit` 을 예외 없이 든다. 값만 있는 항목은
#      원장 항목으로 성립하지 않는다.
#   3. 셀 수 있는 사실은 **필드**다(L17). 산문 필드는 「왜 이렇게 세는가」만 진다 —
#      개수·집합·범위를 산문에 적으면 술어를 고칠 때마다 그 문장이 새 결함이 된다.
#      이 파일의 주석에도 수를 적지 않는다. 게이트가 매번 세어 보고한다.
#   4. 자산이 하나 늘면 행도 하나 는다. `r_scope = false` 여도 행은 있어야 하고 `reason`
#      이 필요하다. 「안 센 것」은 침묵이 아니라 데이터다.
#
# **분모는 이 파일이 아니라 게이트가 든다.** 축 이름 집합 · 자산 하한 · 계측 목록 ·
# `r_scope` 하한과 판정 목록 · 등급 필수 행 · 결손 필수 행 · 제외 축 목록은
# `tests/test_react_verification_ledger.py` 의 리터럴로 산다. 원장에서 유도하면 축을 지우고
# 그만큼 행을 정리하는 것으로 초록이 되고, 극단에는 **빈 원장이 통과**한다.
#
# **제외도 자유 변수가 아니다.** 제외 글롭은 러너 글롭이 잡는 파일을 하나도 건드리지
# 못한다 — 그것이 없으면 제외를 넓히고 크기를 맞추고 삼킨 행을 지우는 것으로 원장이 자기
# 분모를 줄일 수 있다.
#
# **`r_scope` 도 마찬가지다.** 게이트가 하한 술어를 저장소에 돌려 「프런트 트리·웹 표면을
# 이름으로 부르는 자산」을 세고, 그 집합은 전부 `r_scope = true` 여야 한다. 술어가 못 보는데
# 사람이 R 책임으로 판정한 자산만 게이트의 명시 목록으로 들어온다 — 판정은 **넓히는
# 방향으로만** 자유롭다.

