# ---------------------------------------------------------------------------
# 분모가 안 보는 축 — **부재를 선언으로 남긴다**
#
# 위 파티션(자산 ∪ 제외)의 분모는 검증 **트리**이고, 그 트리는 게이트의 `TREE_SPECS` 가
# `tests/**.py` · `tests/js/**.test.js` · `scripts/**{.py,.mjs}` + `conftest.py` 로 정의한다.
# 그래서 검증 사슬의 일부이면서도 **행이 아예 안 생기는** 파일 무리가 있다. 그것을 적지 않으면
# 「전수 피복」이 실제보다 넓게 읽힌다 — 침묵은 0 건과 구별되지 않는다.
#
# 이 절이 하는 일은 **주장을 정직하게 좁히는 것**이고, 축을 트리로 끌어들이는 것이 아니다.
# 형제 원장(`react_ownership_inventory.toml`)이 `excluded_axes` 로 같은 문제를 푼다.
# 배정은 이미 났다(PR-B 착지 판정: 비-Python/JS 검증 자산의 트리 편입은 R5-02) — 그 결정이
# **데이터에 없어서** R1-99 감사자 눈에 침묵이었던 것이 이 절이 태어난 이유다.
#
# 크기를 여기 적지 않는다. 이 원장은 수치 값을 하나도 들지 않는 것이 불변식이고, 그 불변식이
# 2차 라운드를 무너뜨린 자기참조를 끊는다. 게이트는 각 축이 **실재 파일을 가리키는지**와
# **파티션과 겹치지 않는지**를 재실측한다. 열거 종류(`exact`·`file`)는 멤버 하나하나의
# 실재까지 재실측하고, `exact` 는 루트 파일에만 허용한다 — 루트는 맨 아래 폐포가 받아 주므로
# 멤버를 조용히 덜어낼 수 없다(R1-99 F1 「좁힘」의 조치). 남는 사각은 `prefix` 값 자체를
# 좁히는 변경이고, 그것은 게이트가 못 보므로 diff 리뷰 몫이다.
# ---------------------------------------------------------------------------

[[excluded_axis]]
