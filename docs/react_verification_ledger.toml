# 각 자산이 어느 단계에서 만져질지의 인계선. 값 공간은 게이트 리터럴이 정본이다.
#
#   R2-01 단일 React root·제품 entry     R2-02 Python↔TS 계약·typed bridge client
#   R2-03 상태·구독·selector 경계        R2-04 테스트·동일 산출물·패키징 기반
