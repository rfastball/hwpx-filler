# Exact-package floors established by the #168 test portfolio audit.
# Paths are non-recursive by design: native/runtime/distribution surfaces use
# their own gates and must not be hidden inside a low aggregate Python floor.

# Measured source packages must carry a floor above OR appear here (#255 review):
# an unlisted new subpackage fails the gate instead of being silently skipped.
# hwpxfiller/host/native is validated by its own native scenario gate.
unmatched_allow = ["src/hwpxfiller/host/native"]

[packages.hwpxcore]
path = "src/hwpxcore"
line = 95
branch = 87

