# P1 전수 계측을 P2 실행에 필요한 최소 계약으로 동결한 handoff다.
# 상세 근거는 Git 이력(#512~#520)이 소유하며 이 파일은 재생성하지 않는다.
schema = "p2-handoff/v1"
p1_baseline = "4c422654125df627f9f4fcd3a7f111f2bc8b9eb9"
p1_verdict = "ONE_WAVE_READY"
sunset = "P2 완료 및 allowed_direction_violation 0건에서 이 파일과 게이트를 함께 제거"

[ring]
DOMAIN = 0
APPLICATION = 1
FRONTEND_ADAPTER = 2
EXTERNAL_ADAPTER = 2
HOST = 2

[[allowed_direction_violation]]
src = "hwpxcore.text_extract"
dst = "hwpxcore.package"

[[allowed_direction_violation]]
src = "hwpxfiller.core.engine"
