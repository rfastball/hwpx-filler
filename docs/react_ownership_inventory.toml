파서는 문서에 쓰인 시작태그만 본다. 오류 복구로 중복 id·태그 불균형을 조용히 삼키면 값이
줄어든다. JS 가 만드는 id 는 이 축이 아니라 dom_js_site 가 진다(폐포에 함께 든다).
