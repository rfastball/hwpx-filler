# React 소유권 인벤토리 원장 — R1-02 (#402)
#
# 이 파일은 **기계 판독 원장**이다. 산문 설계는 `docs/REACT_MIGRATION_DECISIONS.md`(#401)가
# 지고, old→new 검증 책임은 `docs/react_verification_ledger.toml`(#403)이 진다. 셋은 같은
# 문장을 두 번 들지 않는다.
#
# 게이트: `scripts/check_react_ownership_inventory.py`(+ `tests/test_react_ownership_inventory.py`).
# 그 게이트는 **이 파일의 선언을 믿지 않는다** — 축마다 추출기를 저장소에 다시 돌려 네 방향
# (`M−C` 미분류 · `C−M` 유령 · `members_expected` · `blind_spot`)으로 센다.
#
# 손으로 고칠 때의 규칙 셋:
#   1. 계측 항목은 `predicate`·`scope`·`unit` 을 **예외 없이** 든다. 값만 있는 항목은 성립하지 않는다.
#   2. `evidence` 의 `anchor` 는 그 줄에 실제로 있어야 한다. 좌표가 밀리면 그 자리에서 붉는다.
#   3. 접힌 컨테이너 행의 `members_expected` 는 성장 탐지의 유일한 기계다. 새 id 가 컨테이너
#      **안쪽**에 꽂히면 `M−C` 는 조용하고 이 정수만 어긋난다.
#
# **분모는 이 파일이 아니라 게이트가 든다.** 축 이름 집합 · 축별 측정 하한 · 계측 목록 · 판정
# 요구 목록 · 노드 행 하한은 `scripts/check_react_ownership_inventory.py` 의 AXIS_FLOORS ·
# EXPECTED_METRIC_IDS · EXPECTED_REVIEW_ITEM_IDS · EXPECTED_EXCLUDED_AXES · NODE_ROW_FLOOR 에
# **리터럴로** 산다. 원장에서 유도하면 축을 지우거나 scope 를 좁히고 그만큼 행을 정리하는 것으로
# 초록이 되고, 극단에는 **빈 원장이 통과**한다 — 「미분류 0」은 분모가 고정돼야 명제다.
# 하한을 낮추는 변경은 사유와 함께 그쪽을 고쳐야 하고, 그 변경 자체가 리뷰 대상이다.
#
# **분모의 정의역도 밖이다.** 하한만으로는 축마다 「측정 − 하한」의 무음 삭감 예산이 남고,
# 축의 scope 를 좁히면 측정 집합 M 자체가 줄어 폐포는 계속 참이다. 그래서 게이트가
# `PRODUCT_TREE_GLOBS` 로 **제품 트리를 스스로 열거**해 「모든 파일이 어떤 축의 scope 또는
# 명시 제외에 덮이는가」를 1차로 묻고, `AXIS_DIGESTS` 가 축의 술어·scope·프로브를 지문으로
# 못박는다 — **원장은 값을, 게이트는 술어를** 든다. 술어를 바꾸려면 세 파일이 함께 움직인다.

