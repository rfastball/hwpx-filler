# React 소유권 인벤토리 원장 — R1-02 (#402)
#
# 이 파일은 **기계 판독 원장**이다. 산문 설계는 `docs/REACT_MIGRATION_DECISIONS.md`(#401)가
# 지고, old→new 검증 책임은 `docs/react_verification_ledger.toml`(#403)이 진다. 셋은 같은
# 문장을 두 번 들지 않는다.
#
# 게이트: `scripts/check_react_ownership_inventory.py`(+ `tests/test_react_ownership_inventory.py`).
# 그 게이트는 **이 파일의 선언을 믿지 않는다** — 축마다 추출기를 저장소에 다시 돌려 네 방향
# (`M−C` 미분류 · `C−M` 유령 · `members_expected` · `blind_spot`)으로 센다.
#
# 손으로 고칠 때의 규칙 셋:
#   1. 계측 항목은 `predicate`·`scope`·`unit` 을 **예외 없이** 든다. 값만 있는 항목은 성립하지 않는다.
#   2. `evidence` 의 `anchor` 는 그 줄에 실제로 있어야 한다. 좌표가 밀리면 그 자리에서 붉는다.
#   3. 접힌 컨테이너 행의 `members_expected` 는 성장 탐지의 유일한 기계다. 새 id 가 컨테이너
#      **안쪽**에 꽂히면 `M−C` 는 조용하고 이 정수만 어긋난다.

schema = 1

# 이 원장을 실측한 기준. 재고정 v2 가 `d508724 → 8fcc30e` 무드리프트를 확인했고(frontend/ 무변경)
# 계측은 그 위에서 다시 돌렸다.
baseline_sha = "8fcc30ed07393ffe4608638761a778535caf3be5"

# 이 원장이 주장하는 「미분류 0」의 **정확한 범위**. 산문이 아니라 머리말 데이터다.
scope_statement = """
미분류 0 은 아래 axes 의 추출기가 본 것에 대해 0 이다. 저장소 전체에 대해 0 이 아니다.
각 축의 blind_spot 이 그 차이의 오늘 크기를 들고, 게이트가 그 크기를 매번 재측정한다.
사각을 없애지는 못해도 조용히 자라지는 못한다 — 오늘 도달 가능한 최선이 그것이다.
"""

# 저장소 전수를 도는 scope 를 가진 계측 항목의 목록. 그런 항목은 고정 수치가 아니라 base_sha
# 앵커 + 정당화된 delta 로만 적을 수 있다. 오늘 0개다 — 모든 축이 frontend/** + src/hwpxfiller
# 로 한정돼 tests/** 변동에 무감하다. 하나가 생기면 이 규칙이 그 자리에서 걸린다.
repo_wide_metrics = []

# ── 폐포에서 명시 제외하는 축 ─────────────────────────────────────────────
# 「안 센 것」을 데이터로 적는다. 조용한 유예가 아니라 **소리 나는 제외**여야 「미분류 0」이
# 거짓말이 되지 않는다.

[[excluded_axes]]
axis = "js_planted_data_attrs"
reason = """
frontend/js 가 템플릿 조각으로 심는 data-* 속성의 전수. 정규식은 CSS 선택자 문자열·산문
주석·클래스 이름을 함께 세어 오답을 낸다(무앵커로 세면 66종/302회). 템플릿 조각 **안의
속성 위치**를 판별하는 추출기가 오늘 없다. 정적 문서 쪽 축(dom_data_attr)은 파서로 닫혔다.
"""
owner = "#412"

# ── 추출기 레지스트리 ────────────────────────────────────────────────────
# `backing` 은 「이 값이 얼마나 믿을 만한가」를 이름이 아니라 종류로 말한다. 구현은
# `scripts/check_react_ownership_inventory.py` 의 EXTRACTORS 가 소유하고, 그쪽이 scope 를
# 함께 들어 원장이 범위를 혼자 다시 쓰지 못하게 한다.

[extractors.html_ids]
backing = "parser"
implementation = "html.parser(stdlib) — 시작태그의 id 속성"

[extractors.html_data_attrs]
backing = "parser"
implementation = "html.parser(stdlib) — 시작태그의 data-* 속성 이름"

[extractors.js_template_ids]
backing = "ast"
implementation = "vite(oxc) parseAst — 템플릿 리터럴 quasi·문자열 리터럴 + 앵커 정규식 (?<![\\w-])id=\""

[extractors.js_module_state]
backing = "ast"
implementation = "vite(oxc) parseAst — Program 최상위 ∪ export 된 최상위 함수 body 최상위의 let/var"

[extractors.js_nonexported_fn_state]
backing = "ast"
implementation = "위와 같은 추출기의 exported 조건을 뒤집은 것 — 값과 사각을 한 함수가 낸다"

[extractors.js_module_state_convention]
backing = "regex-convention"
implementation = "^  (?:let|var)\\s+([A-Za-z_$][\\w$]*) — test_web_dom_contract.py 의 예산 헬퍼와 같은 눈"

[extractors.js_module_state_convention_budget]
backing = "regex-convention"
implementation = "위 관례를 MUTABLE_MODULE_STATE_BUDGET 6파일로 좁힌 것 — 그 안에서는 AST 와 일치한다"

[extractors.action_registry_screens]
backing = "python-import"
implementation = "hwpxfiller.webapp.action_registry.ACTION_REGISTRY 의 키"

[extractors.action_registry_pairs]
backing = "python-import"
implementation = "같은 레지스트리의 (화면, 액션) 쌍"

[extractors.ring1_state_modules]
backing = "python-import"
implementation = "src/hwpxfiller/gui/*_state.py 파일 전수"

[extractors.html_parse_anomalies]
backing = "parser"
implementation = "중복 id · 태그 불균형 — 파서의 관용 복구가 삼킬 수 있는 것"

[extractors.html_data_attr_regex_delta]
backing = "regex-convention"
implementation = "무앵커 data-[a-z-]+ 와 파서 결과의 차집합 — 정규식이 더 잡는 이름"

[extractors.js_id_attr_anchor_gaps]
backing = "regex-convention"
implementation = "다른 속성명 접미 · 홑따옴표 · 무따옴표 보간 · 선택자 리터럴 네 형태"

[extractors.action_registry_dynamic]
backing = "regex-convention"
implementation = "ACTION_REGISTRY 의 런타임 변형 사이트"

[extractors.gui_non_state_modules]
backing = "python-import"
implementation = "gui/ 아래 *_state.py 이름 규약 밖의 모듈"

[extractors.listener_convention_gaps]
backing = "regex-convention"
implementation = "주석 안 일치 · 대괄호 표기 호출 — 관례 정규식이 함께 세거나 못 보는 것"

# ── 축 선언 ──────────────────────────────────────────────────────────────

