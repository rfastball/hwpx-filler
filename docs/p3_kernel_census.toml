# P3-01 kernel census — hwpxfiller.core · hwpxcore symbol/consumer/effect 전수 원장 (#593)
#
# 임시 실행 원장이다: P3-03~P3-05 가 소비하고, P3-99 종료 시 제거되거나 영구 계약으로
# 승격된다(#585 완료 조건 13). 짝 게이트: tests/repo_contract/test_p3_kernel_census.py
#
# 기준선: master da50c48 (#594 facade 8 퇴역 반영 — #585 보정 코멘트 참조)
# 계측기: AST import 그래프(상대 import 해석 포함) + 문자열 dynamic 참조 + spec hidden import.
#   consumers 수치는 "모듈을 import 하는 파일 수"(중복 import 문 제거).
#   production=src/**, test=tests/**, scripts=scripts/**+examples/**,
#   build=packaging/**(+.spec hidden import)+pyproject entry point.
#   consumer_kind: ``module_import`` 또는 cluster 심벌 사용 파일 수인 ``symbol_use``.
#
# disposition 어휘 (#593):
#   FORMAT_KERNEL | PRODUCT_DOMAIN | APPLICATION | EXTERNAL_ADAPTER | HOST
#   | TEMP_SAME_OBJECT_FACADE | REMOVE | BLOCKED_NEEDS_P2_DECISION
#
# 규칙: p2_target_authority 는 docs/module_rings.toml 의 target 을 그대로 옮긴 것(P3 재분류
# 금지). hwpxcore 의 제품 의미 비인지 DOMAIN 만 P3 어휘로 FORMAT_KERNEL,
# hwpxfiller.core 의 DOMAIN 은 PRODUCT_DOMAIN 으로 사상한다(#585 결정 2).
# 한 파일에 성질이 섞인 곳은 symbol cluster 로 갈랐다(package path IO · job realpath ·
# mapping load).

schema = [
  "id", "current_module", "symbol", "visibility", "consumers", "consumer_kind",
  "product_semantics_awareness", "environment_or_effect", "p2_target_authority",
  "target_canonical_import", "behavior_oracle", "compatibility_evidence", "disposition",
]

baseline_master = "da50c48b54f5eae25f274f69011789ecf211334f"

