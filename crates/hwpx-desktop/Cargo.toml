[package]
name = "hwpx-desktop"
version = "0.15.0"
edition.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[[bin]]
name = "hwpxfiller"
path = "src/bin/hwpxfiller.rs"

[[bin]]
name = "documentnarmi"
path = "src/bin/documentnarmi.rs"
required-features = ["shell"]

[features]
default = ["shell"]
shell = ["dep:tauri", "dep:tauri-build"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
base64 = "=0.23.1"
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
uuid = { version = "=1.29.0", features = ["v4"] }
hwpx-filler = { path = "../hwpx-filler" }
hwpx-core = { path = "../hwpx-core" }
hwpx-artifact = { path = "../hwpx-artifact" }
tauri = { version = "=2.12.5", default-features = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_DataExchange",
  "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Ole", "Win32_System_Com",
  "Win32_Storage_FileSystem",
  "Win32_Networking_WinHttp", "Win32_Security_Credentials",
  "Win32_System_Registry",
] }

[dev-dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled"] }
syn = { version = "=2.0.119", features = ["full", "visit"] }
toml = "=1.2.0"

[build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }
